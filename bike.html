<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Animated guide to Berlin cycling rules: right-of-way at crossings, bike infrastructure, turning, traffic lights, trams and dooring.">
<title>Berlin Radfahren</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E9EBE6; --line:#D3D6CF;
  --ink:#1B1F26; --muted:#5C6470; --faint:#8A919B;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --accent-soft:#DCE6F7;
  --bvg:#F2D53C; --go:#2A9D5C; --go-soft:#DDF1E5; --wait:#D23B3B; --wait-soft:#F8DEDE; --warn:#C9860B; --warn-soft:#F7EBD1;
  --asphalt:#45484E; --asphalt-2:#3B3E44; --paint:#ECE9DC; --kerb:#B9BDB3; --ground:#CFD3C8; --grass:#B8C9AA;
  --shadow:0 1px 2px rgba(20,24,30,.08),0 8px 24px rgba(20,24,30,.08);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171B; --surface:#1E2126; --surface-2:#262A30; --line:#343940;
    --ink:#E8EAE6; --muted:#A5ACB6; --faint:#737A85;
    --accent:#6D9BE8; --accent-ink:#0F1621; --accent-soft:#233450;
    --go:#4DBF7E; --go-soft:#1E3A2B; --wait:#E5605E; --wait-soft:#43262A; --warn:#E0A63A; --warn-soft:#3E3320;
    --asphalt:#3A3D43; --asphalt-2:#30333A; --paint:#DCD8C8; --kerb:#5B6068; --ground:#2A2E33; --grass:#2F3A2C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1E2126; --surface-2:#262A30; --line:#343940;
  --ink:#E8EAE6; --muted:#A5ACB6; --faint:#737A85;
  --accent:#6D9BE8; --accent-ink:#0F1621; --accent-soft:#233450;
  --go:#4DBF7E; --go-soft:#1E3A2B; --wait:#E5605E; --wait-soft:#43262A; --warn:#E0A63A; --warn-soft:#3E3320;
  --asphalt:#3A3D43; --asphalt-2:#30333A; --paint:#DCD8C8; --kerb:#5B6068; --ground:#2A2E33; --grass:#2F3A2C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 28px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .mark{width:34px;height:34px;flex:none}
.brand h1{font:700 22px/1 var(--display);margin:0;letter-spacing:.01em}
.brand small{display:block;font:400 12px/1.2 var(--body);color:var(--muted);margin-top:3px}
.rail nav button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 8px;border-radius:6px;text-align:left;font-size:14px;color:var(--ink)}
.rail nav button:hover{background:var(--surface-2)}
.rail nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.rail nav .num{font:500 11px var(--mono);color:var(--faint);width:18px;flex:none}
.rail nav .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
.rail .sep{height:1px;background:var(--line);margin:10px 6px}
.rail .eyebrow{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 8px 4px}
/* main */
.main{padding:28px 36px 60px;max-width:1180px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.crumb{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crumb b{color:var(--accent)}
.progress{font:500 12px var(--mono);color:var(--faint)}
.scene-head h2{font:700 clamp(28px,3.4vw,40px)/1.05 var(--display);margin:0;text-wrap:balance}
.scene-head .de{font:italic 400 17px var(--body);color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:24px;margin-top:18px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.stage > svg{display:block;width:100%;height:auto;background:var(--ground)}
.controls{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.controls button{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink)}
.controls button:hover{background:var(--surface-2)}
.controls button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.controls button.primary:hover{filter:brightness(1.08)}
.controls button.on{background:var(--accent-soft);border-color:var(--accent)}
.controls .spacer{flex:1}
.controls svg{width:14px;height:14px;fill:currentColor}
.timeline{height:4px;background:var(--surface-2);position:relative}
.timeline i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.timeline b{position:absolute;top:-2px;width:2px;height:8px;background:var(--faint);margin-left:-1px}
.caption{padding:12px 14px;min-height:56px;font-size:15px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.caption .stepno{flex:none;font:500 12px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 6px;margin-top:2px}
.quiz{padding:12px 14px;border-top:1px solid var(--line);background:var(--warn-soft)}
.quiz p{margin:0 0 8px;font-weight:600}
.quiz .opts{display:flex;flex-wrap:wrap;gap:6px}
.quiz .opts button{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.quiz .opts button .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.quiz .fb{margin-top:8px;font-size:14px}
.quiz .fb.ok{color:var(--go)} .quiz .fb.no{color:var(--wait)}
/* explain */
.explain{display:flex;flex-direction:column;gap:0}
.card{background:none;border:none;border-top:1px solid var(--line);border-radius:0;padding:18px 0}
.card:first-child{border-top:none;padding-top:0}
.card h3{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.card p{margin:0;font-size:15px;max-width:62ch;line-height:1.6}
.card p+p{margin-top:8px}
.card.rule h3{color:var(--go)}
.card.mistake h3{color:var(--wait)}
.card.berlin h3{color:var(--warn)}
.card .stvo{display:inline-block;margin-top:12px;font:500 11px var(--mono);color:var(--faint);border:1px solid var(--line);padding:2px 8px;border-radius:2px;letter-spacing:.04em}
.signs{display:flex;flex-wrap:wrap;gap:10px}
.signs .s{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:8px;padding:6px 10px 6px 6px;font-size:13px}
.signs .s svg{width:38px;height:38px;flex:none}
.signs .s b{display:block;font-weight:600}
.signs .s span{color:var(--muted);font-size:12px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:14px;height:22px;border-radius:3px;flex:none}
.legend .badge{width:auto;height:auto;font:600 10px var(--body);padding:2px 6px;border-radius:999px;letter-spacing:.06em;color:#fff;font-style:normal}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.pager button{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:46%;text-align:left}
.pager button:hover{background:var(--surface-2)}
.pager button.next{text-align:right;margin-left:auto}
.pager small{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager span{font:700 18px/1.1 var(--display)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center;margin-bottom:26px}
.hero h2{font:700 clamp(36px,5vw,56px)/1 var(--display);margin:0 0 10px;text-wrap:balance}
.hero p{font-size:17px;color:var(--muted);max-width:58ch;margin:0 0 8px}
.hero .stage{margin:0}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chapters button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.chapters button:hover{border-color:var(--accent)}
.chapters .num{font:500 11px var(--mono);color:var(--faint)}
.chapters .t{font:700 20px/1.1 var(--display)}
.chapters .d{font-size:13px;color:var(--muted)}
.chapters .c{font:500 11px var(--mono);color:var(--accent);margin-top:4px}
.section-title{font:700 24px/1.1 var(--display);margin:30px 0 10px}
/* glossary */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.gloss .g{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gloss .g svg{width:56px;height:56px;flex:none}
.gloss .g b{display:block;font-weight:600}
.gloss .g .code{font:500 11px var(--mono);color:var(--faint)}
.gloss .g p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.gloss .g a{font-size:12px}
/* scene list in chapter view */
.scenelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.scenelist button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.scenelist button:hover{border-color:var(--accent)}
.scenelist .th > svg{width:100%;height:auto;background:var(--ground);display:block}
.scenelist .t{padding:8px 12px 10px;font:700 17px/1.15 var(--display)}
.scenelist .de{font:italic 400 12px var(--body);color:var(--muted);display:block;margin-top:2px}
.hidden{display:none!important}
.menu-btn{display:none}
/* floating next/prev — desktop only */
.float-nav{display:none}
@media (min-width:901px){
  .float-nav{position:fixed;bottom:24px;right:28px;display:flex;gap:8px;z-index:50}
  .float-nav button{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--body);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .float-nav button:hover{background:var(--surface-2)}
  .float-nav button.fn-next{background:var(--go);color:#fff;border-color:var(--go)}
  .float-nav button.fn-next:hover{filter:brightness(1.08)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px}
  .rail nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .rail nav button{width:auto;white-space:nowrap;padding:6px 10px}
  .rail nav .cnt,.rail .sep,.rail .eyebrow{display:none}
  .main{padding:18px 16px 50px}
  .grid,.hero{grid-template-columns:1fr}
}
@keyframes capEnter { from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:translateY(0); } }
.caption.cap-enter { animation: capEnter .3s ease-out both; }
@media (prefers-reduced-motion: reduce){
  .stage *{transition:none!important}
  .caption.cap-enter{animation:none}
}
</style>
<style>img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="6" fill="#3DAE6B"/><rect x="9" y="9" width="22" height="22" fill="#fff"/><circle cx="20" cy="20" r="7" fill="#3DAE6B"/></svg>
      <div><h1>Berlin Radfahren</h1><small>Rules of the road for cyclists</small></div>
      <a href="index.html" style="display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font:600 12px var(--body);text-decoration:none;white-space:nowrap">🚗 Auto guide →</a>
    </div>
    <nav id="nav" aria-label="Chapters"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
// ---- Traffic sign library (simplified vector versions of German StVO signs) ----
const SIGN_RED = '#C8102E', SIGN_BLUE = '#0F4C9A', SIGN_WHITE = '#FFFFFF', SIGN_BLACK = '#111111', SIGN_YELLOW = '#F5C400', SIGN_GREEN = '#1E9E4A';
function triDown(fill, stroke){ return `<path d="M6 12 H94 L50 90 Z" fill="${fill}" stroke="${stroke}" stroke-width="10" stroke-linejoin="round"/>`; }
function triUp(inner){ return `<path d="M50 10 L94 88 H6 Z" fill="${SIGN_WHITE}" stroke="${SIGN_RED}" stroke-width="10" stroke-linejoin="round"/>${inner||''}`; }
function circleBlue(inner){ return `<circle cx="50" cy="50" r="46" fill="${SIGN_BLUE}" stroke="${SIGN_WHITE}" stroke-width="4"/>${inner||''}`; }
function circleRed(inner){ return `<circle cx="50" cy="50" r="46" fill="${SIGN_WHITE}" stroke="${SIGN_RED}" stroke-width="10"/>${inner||''}`; }
function rectBlue(inner){ return `<rect x="4" y="4" width="92" height="92" rx="6" fill="${SIGN_BLUE}" stroke="${SIGN_WHITE}" stroke-width="3"/>${inner||''}`; }
function plate(inner){ return `<rect x="4" y="4" width="92" height="92" rx="5" fill="${SIGN_WHITE}" stroke="${SIGN_BLACK}" stroke-width="3"/>${inner||''}`; }
function arrowUp(x,y,s,fill){ return `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -22 L12 -6 H5 V22 H-5 V-6 H-12 Z" fill="${fill}"/>`; }
function bikeIcon(fill){ return `<g fill="none" stroke="${fill}" stroke-width="5" stroke-linecap="round"><circle cx="30" cy="62" r="14"/><circle cx="70" cy="62" r="14"/><path d="M30 62 L45 36 H62 L70 62 M45 36 L52 62 M40 36 H52"/></g>`; }
function pedIcon(x,y,s,fill){ return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}"><circle cx="0" cy="-22" r="6"/><path d="M-4 -14 H4 L8 4 L4 4 L4 22 H-1 L-1 6 L-4 22 H-9 L-6 4 L-8 -2 Z"/></g>`; }
function carIcon(x,y,s,fill){ return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}"><path d="M-22 6 L-16 -8 L-6 -14 H8 L18 -8 L22 6 V12 H-22 Z"/><circle cx="-12" cy="12" r="5"/><circle cx="12" cy="12" r="5"/></g>`; }
function bentLine(from, to){ // priority-plate line, 'from'/'to' in S,N,E,W ; thick black line
  const P = {S:[50,92],N:[50,8],E:[92,50],W:[8,50]};
  const a=P[from], b=P[to];
  return `<path d="M${a[0]} ${a[1]} L50 50 L${b[0]} ${b[1]}" fill="none" stroke="${SIGN_BLACK}" stroke-width="12" stroke-linejoin="round"/>`;
}
function thinArms(list){ return list.map(d=>{const P={S:[50,92],N:[50,8],E:[92,50],W:[8,50]};const a=P[d];return `<path d="M50 50 L${a[0]} ${a[1]}" stroke="${SIGN_BLACK}" stroke-width="4"/>`;}).join(''); }

const SIGNS = {
  '205': { name:'Vorfahrt gewähren', en:'Give way', desc:'Upside-down triangle. Others go first — you may roll on without stopping if the road is clear.', svg: () => triDown(SIGN_WHITE, SIGN_RED) },
  '206': { name:'Stop', en:'Stop and give way', desc:'Come to a full stop at the line (or where you can see), then go only when clear. A "rolling stop" is a fine.', svg: () => `<path d="M30 4 H70 L96 30 V70 L70 96 H30 L4 70 V30 Z" fill="${SIGN_RED}" stroke="${SIGN_WHITE}" stroke-width="4"/><text x="50" y="60" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#fff">STOP</text>` },
  '301': { name:'Vorfahrt', en:'Priority at the next intersection only', desc:'You go first at the next crossing. After that, right-before-left is back unless another sign says otherwise.', svg: () => triUp() },
  '306': { name:'Vorfahrtstraße', en:'Priority road', desc:'Yellow diamond: you have priority at every crossing until sign 307 ends it. Side streets must give way to you.', svg: () => `<path d="M50 4 L96 50 L50 96 L4 50 Z" fill="${SIGN_WHITE}"/><path d="M50 16 L84 50 L50 84 L16 50 Z" fill="${SIGN_YELLOW}"/>` },
  '307': { name:'Ende der Vorfahrtstraße', en:'End of priority road', desc:'Priority road ends here. From the next crossing, right-before-left applies again unless signed.', svg: () => `<path d="M50 4 L96 50 L50 96 L4 50 Z" fill="${SIGN_WHITE}"/><path d="M50 16 L84 50 L50 84 L16 50 Z" fill="${SIGN_YELLOW}"/><path d="M20 80 L80 20 M28 88 L88 28 M12 72 L72 12" stroke="${SIGN_BLACK}" stroke-width="4"/>` },
  '102': { name:'Kreuzung mit Vorfahrt von rechts', en:'Crossing ahead — right before left', desc:'Warning: at the next crossing, whoever comes from the right goes first. Slow down and look right.', svg: () => triUp(`<path d="M50 34 V78 M30 56 H70" stroke="${SIGN_BLACK}" stroke-width="9"/>`) },
  '1002-10': { name:'Abknickende Vorfahrt (von unten nach rechts)', en:'Priority road bends right', desc:'The thick line shows where the priority road goes. If you follow the bend, you keep priority — but you must signal.', svg: () => plate(thinArms(['N']) + bentLine('S','E')) },
  '1002-20': { name:'Abknickende Vorfahrt (von unten nach links)', en:'Priority road bends left', desc:'The thick line shows where the priority road goes. Follow the bend with your indicator on; you keep priority.', svg: () => plate(thinArms(['N']) + bentLine('S','W')) },
  '1002-11': { name:'Abknickende Vorfahrt (Seitenstraße)', en:'Priority road bends, seen from the side street', desc:'You are on the thin line. The priority road runs across and bends — everything on the thick line goes before you.', svg: () => plate(thinArms(['S']) + bentLine('W','N')) },
  '215': { name:'Kreisverkehr', en:'Roundabout', desc:'Together with the give-way triangle: cars already in the roundabout go first. No indicator when entering, indicator when leaving.', svg: () => circleBlue(`<g fill="none" stroke="#fff" stroke-width="7"><path d="M50 22 A28 28 0 1 0 74 36"/><path d="M50 22 A28 28 0 0 0 26 36" /></g><path d="M70 22 L80 40 L60 40 Z" fill="#fff"/><path d="M22 60 L20 40 L36 52 Z" fill="#fff"/><path d="M52 82 L70 72 L66 88 Z" fill="#fff"/>`) },
  '220': { name:'Einbahnstraße', en:'One-way street', desc:'Traffic only flows in the arrow direction. Priority rules do not change — right-before-left still applies at unsigned crossings.', svg: () => `<rect x="2" y="26" width="96" height="48" fill="${SIGN_BLUE}" stroke="#fff" stroke-width="3"/><path d="M14 50 H70 L58 36 M70 50 L58 64" fill="none" stroke="#fff" stroke-width="8"/><text x="50" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#fff">Einbahnstraße</text>` },
  '209': { name:'Vorgeschriebene Fahrtrichtung rechts', en:'You must turn right', desc:'Blue circle with an arrow: the only allowed direction. Common at the end of one-way streets and side roads onto main roads.', svg: () => circleBlue(`<path d="M28 50 H66 L54 36 M66 50 L54 64" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`) },
  '209-10': { name:'Vorgeschriebene Fahrtrichtung geradeaus', en:'Straight ahead only', desc:'No turning at this crossing.', svg: () => circleBlue(arrowUp(50,50,1.4,'#fff')) },
  '720': { name:'Grünpfeil', en:'Green arrow plate', desc:'Small green arrow next to the red light: you may turn right on red — but only after a full stop, and only if nobody (especially cyclists and pedestrians) is hindered.', svg: () => `<rect x="4" y="4" width="92" height="92" fill="${SIGN_BLACK}"/><path d="M22 50 H66 L52 32 M66 50 L52 68" fill="none" stroke="${SIGN_GREEN}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>` },
  '325.1': { name:'Verkehrsberuhigter Bereich', en:'Traffic-calmed area (living street)', desc:'Walking pace only, pedestrians may use the whole street, children may play. When you leave the area you must give way to everyone.', svg: () => rectBlue(`<rect x="14" y="14" width="72" height="72" fill="#fff"/><path d="M20 44 L36 30 L52 44 Z" fill="${SIGN_BLUE}"/><rect x="24" y="44" width="24" height="18" fill="${SIGN_BLUE}"/>${carIcon(68,72,.55,SIGN_BLUE)}${pedIcon(30,76,.55,SIGN_BLUE)}${pedIcon(52,80,.4,SIGN_BLUE)}<circle cx="62" cy="40" r="5" fill="${SIGN_BLUE}"/>`) },

function rotPt(x,y,deg){ const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a); return [Math.round((x*c - y*s)*100)/100, Math.round((x*s + y*c)*100)/100]; }

}

function ease(x){ x=Math.max(0,Math.min(1,x)); return x<.5? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }
function easeOut(x){ x=Math.max(0,Math.min(1,x)); return 1-Math.pow(1-x,3); }

function computeLightPhases(scene, goTs){
  if(!scene.road || !scene.road.lights || !scene.road.lights.length) return null;
  const dirs = scene.road.lights;
  const kf = [{ at:-1 }]; dirs.forEach(d=>{ kf[0][d]='red'; });
  (scene.order||[]).forEach((grp,i)=>{
    const fromDirs = new Set();
    grp.forEach(id=>{ const a=(scene.actors||[]).find(x=>x.id===id); if(a && a.from) fromDirs.add(a.from); });
    const ns = fromDirs.has('S')||fromDirs.has('N');
    const ew = fromDirs.has('E')||fromDirs.has('W');
    const phase = { at:(goTs[i]||2)-0.4 };
    dirs.forEach(d=>{ phase[d] = (ns&&(d==='S'||d==='N'))||(ew&&(d==='E'||d==='W')) ? 'green' : 'red'; });
    kf.push(phase);
  });
  return kf;
}

  stvo:'§ 8 Abs. 1 StVO' },
{ id:'bk-priority-on', ch:1, title:'You are on the priority road', de:'Auf der Vorfahrtstraße',
  road:{wait:['E','W']}, signs:[{code:'306',at:'S'},{code:'205',at:'E'},{code:'205',at:'W'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'a',kind:'car',from:'E',label:'Car on side street'}],
  order:[['you'],['a']],
  captions:['Yellow diamond: you are on a priority road. The side street has a give-way triangle.','The car must wait for you — just as it would for any vehicle on the priority road.','Go. Priority roads protect cyclists and cars equally.'],
  rule:'A cyclist on a priority road has the same right of way as a car. Side streets must yield. Ride visibly and at a speed that lets you stop if a driver fails to see you.',
  mistake:'Thinking the car will definitely stop. Priority does not mean safe — always be ready to brake.',
  stvo:'Zeichen 306, § 8 StVO' },
{ id:'bk-priority-off', ch:1, title:'You are on the side street', de:'Aus der Nebenstraße',
  road:{wait:['S']}, signs:[{code:'205',at:'S'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'a',kind:'car',from:'W',through:true,label:'Car on priority road'}],
  order:[['a'],['you']],
  captions:['A give-way triangle: you must yield to the main road.','Wait for the car to pass. Do not roll out expecting the driver to stop.','When clear, join the main road.'],
  rule:'A give-way triangle means stop or slow to a standstill if necessary — whether you are in a car or on a bike. Cyclists sometimes roll through these at speed. That is a fine and a crash risk.',
  mistake:'Treating the triangle as a "slow down" sign. If a vehicle is close, stop completely.',
  stvo:'Zeichen 205, § 8 StVO' },

// ===== Chapter 2: Bike infrastructure =====
{ id:'bk-radweg', ch:2, title:'Mandatory cycle path: cars must yield', de:'Benutzungspflichtiger Radweg',
  road:{bike:['NS']}, signs:[{code:'237',x:112,y:260,size:32}],
  actors:[{id:'you',kind:'you',from:'S',turn:'bike',through:true,travel:3.5},{id:'a',kind:'car',from:'S',turn:'right',delay:.8,label:'Car turning right'}],
  order:[['you'],['a']],
  captions:['Sign 237: you must use the cycle path. A car turns right across it.','You are going straight — you have priority over the turning car.','The car must wait for you before crossing the cycle path. Look for it anyway.'],
  rule:'Sign 237 makes the cycle path mandatory. When a car turns across it, you have priority: the turning driver must yield. This applies even if the path runs on the pavement — watch for drivers who do not check far enough.',
  mistake:'Assuming the turning car has seen you. Approach turns at a speed you can stop from.',
  stvo:'Zeichen 237, § 9 Abs. 3 StVO' },
{ id:'bk-schutzstreifen', ch:2, title:'Dashed lane: your space on the road', de:'Schutzstreifen – gestrichelte Linie',
  road:{type:'straight',bikeLane:['S']},
  actors:[{id:'you',kind:'you',path:'M48 330 L48 -330',stop:0,through:true,travel:9},{id:'a',kind:'car',path:'M30 -330 L30 330',stop:0,through:true,travel:9,label:'Car beside'}],
  order:[['you','a']], duration:9,
  captions:['The dashed line is a Schutzstreifen — a recommended cyclist lane on the road.','Cars may cross the dashes only when necessary and must not endanger you.','Ride in the middle of the stripe, not the edge — the gutter has drains, gravel, and doors.'],
  rule:'The Schutzstreifen (Zeichen 340) is not physically exclusive to cyclists, but you have priority within it. A driver who forces you off your line is liable. Ride confidently in the centre of the stripe.',
  mistake:'Riding at the very right edge of the Schutzstreifen. The space near the kerb and parked cars is the most dangerous part.',
  stvo:'§ 42 StVO, Zeichen 340' },
{ id:'bk-radfahrstreifen', ch:2, title:'Solid lane: cars may never cross', de:'Radfahrstreifen – durchgezogene Linie',
  road:{type:'straight',bikeLane:['S']},
  actors:[{id:'you',kind:'you',path:'M48 330 L48 -330',stop:0,through:true,travel:9},{id:'a',kind:'car',path:'M30 -330 L30 330',stop:0,through:true,travel:9,label:'Car beside'}],
  order:[['you','a']], duration:9,
  captions:['A solid white line marks a Radfahrstreifen — a protected cycle lane. You must use it.','Unlike the dashed Schutzstreifen, cars may never cross this solid line.','Ride with confidence; a driver who enters the solid lane is breaking the law.'],
  rule:'The Radfahrstreifen (solid line, Zeichen 237) is legally exclusive to cyclists. Cars cannot enter. You must ride in it. It offers stronger protection than the dashed Schutzstreifen.',
  mistake:'Mixing up solid and dashed lanes. The solid line is harder to see from the bike — look for the sign.',
  stvo:'§ 41 StVO, Zeichen 237, § 2 Abs. 4 StVO' },
{ id:'bk-fahrradstrasse', ch:2, title:'Bicycle street: you set the pace', de:'Fahrradstraße',
  road:{type:'straight'}, signs:[{code:'244.1',x:86,y:260,size:34},{code:'kfzfrei',x:86,y:220,size:28}],
  actors:[{id:'you',kind:'you',path:'M18 330 L18 -330',stop:0,through:true,travel:9},{id:'b1',kind:'bike',path:'M40 320 L40 -330',stop:0,through:true,travel:9,delay:.3,label:'Another cyclist'},{id:'a',kind:'car',path:'M30 330 L30 -330',stop:0,through:true,travel:9,delay:.8,label:'Car (guest)'}],
  order:[['you','b1','a']], duration:11,
  captions:['A Fahrradstraße. The plate says cars are allowed — as guests.','You and other cyclists own the lane; you may ride side by side.','The car follows at your pace — max 30 km/h. It may not push you or overtake at less than 1.5 m.'],
  rule:'In a bicycle street you set the tempo. Cyclists may ride two abreast. Cars (if the plate allows them) drive at most 30 km/h and must not push or overtake at less than 1.5 m. Honking is a fine.',
  mistake:'Riding single file to let the car pass. You have priority here — hold your line.',
  berlin:'Berlin has dozens of bicycle streets: Linienstraße, Bergmannstraße, Stargarder Straße and many Kiez streets. Most say "Anlieger frei" — only local traffic by car.',
  stvo:'§ 41 StVO, Zeichen 244.1' },

// ===== Chapter 3: Turning =====
{ id:'bk-turn-right', ch:3, title:'Turning right: signal and yield to pedestrians', de:'Rechtsabbiegen',
  road:{}, signs:[{code:'306',at:'S'},{code:'306',at:'E'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'p',kind:'ped',path:'M132 100 L-100 100',stop:0,noIntent:true,label:'Pedestrian crossing'}],
  order:[['p'],['you']],
  captions:['You want to turn right. A pedestrian is crossing the road you are entering.','Signal right early (extend right arm). Pedestrians crossing the entry road have priority.','When the crossing is clear, turn.'],
  rule:'Turning right, you must yield to pedestrians crossing the road you are entering. Signal early, and check behind for overtaking cyclists before moving right.',
  mistake:'Cutting the corner tightly. Swing wide enough to see the pavement before committing.',
  stvo:'§ 9 Abs. 3 StVO' },
{ id:'bk-turn-left-direct', ch:3, title:'Left turn — direct', de:'Linksabbiegen direkt',
  road:{bike:['NS']}, signs:[{code:'306',at:'S'},{code:'306',at:'N'},{code:'306',at:'W'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'left'},{id:'b',kind:'car',from:'N',through:true,label:'Oncoming car'},{id:'bk',kind:'bike',from:'N',turn:'bike',through:true,delay:.5,label:'Oncoming cyclist'}],
  order:[['b','bk'],['you']],
  captions:['You want to turn left. Oncoming traffic — a car and a cyclist on the cycle path — comes toward you.','Everything coming straight toward you goes first: cars, cyclists, trams.','Signal left (extend left arm). Wait until clear, then turn.'],
  rule:'Turning left, yield to all oncoming traffic. The oncoming cyclist on the cycle path is easy to miss — they are faster than they look and often hidden behind parked cars.',
  mistake:'Watching only the car lane and missing the oncoming cycle path.',
  stvo:'§ 9 Abs. 3 StVO' },
{ id:'bk-turn-left-indirect', ch:3, title:'Left turn — two-stage (indirekt)', de:'Indirektes Linksabbiegen',
  road:{lights:['S','N','E','W']},
  actors:[{id:'you',kind:'you',from:'S'}],
  order:[['you']], duration:8,
  captions:['At a busy junction you can do a safer two-stage left turn: first go straight with the green.','Wait at the far corner facing your new direction.','When the new signal turns green, go. Two-stage — no crossing oncoming traffic.'],
  rule:'The indirect left turn (indirektes Linksabbiegen) is always allowed and often safer. Cross straight first, wait at the far corner, then go with the next green. No cutting across traffic.',
  mistake:'Starting the two-stage turn too late — ending up stranded in the junction. Cross all the way to the far kerb.',
  stvo:'§ 9 StVO' },
{ id:'bk-leave-lane', ch:3, title:'Leave cycle lane to turn left', de:'Radweg verlassen zum Linksabbiegen',
  road:{bike:['NS']}, signs:[{code:'237',x:112,y:260,size:30}],
  actors:[{id:'you',kind:'you',from:'S',turn:'left'},{id:'a',kind:'car',from:'S',through:true,delay:.4,label:'Following car'}],
  order:[['you'],['a']],
  captions:['You are on the mandatory cycle path and want to turn left. Merge onto the road early.','Signal left, check behind for cars and cyclists. When safe, move to the left-turn position.','Wait for oncoming traffic, then complete the left turn.'],
  rule:'To turn left from a cycle path, merge onto the road and position yourself at the centre-line well before the junction. Signal clearly and check behind. Alternatively, use the two-stage indirect turn.',
  mistake:'Turning left from the cycle path without merging — crossing oncoming traffic diagonally.',
  stvo:'§ 9 Abs. 1 StVO' },

{ id:'bk-lane-merge-left', ch:3, title:'Two lanes: merge left before turning', de:'Zweispurig: Links einordnen',
  road:{},
  extras:[`<line x1="20" y1="320" x2="20" y2="85" stroke="var(--paint)" stroke-width="2" stroke-dasharray="18 12" stroke-linecap="round"/>`],
  actors:[
    {id:'you',kind:'you',path:'M30 330 L30 200 Q30 150 10 130 L10 72 C10 18 -38 2 -72 -30 L-330 -30',stop:245,indicator:-1,indFrom:.30},
    {id:'a',kind:'car',from:'N',through:true,label:'Oncoming car',delay:.2},
    {id:'b',kind:'car',path:'M40 330 L40 -330',stop:262,delay:.9,label:'Car: right lane'}
  ],
  order:[['a'],['you'],['b']],
  captions:['A two-lane road — two lanes in your direction. You want to turn left at the junction. The right lane is for straight and right turns.','Signal left early. Check mirror and blind spot, then merge from the right lane into the left (inner) lane before reaching the junction.','Wait in the left lane for oncoming traffic to clear, then turn left. The car behind you continues straight in the right lane.'],
  rule:'On a multi-lane road, move into the left lane well before the junction — not at the last moment. Signal early, check mirror and shoulder, merge gradually, then wait for oncoming traffic.',
  mistake:'Turning left from the right lane. You cut across the left lane mid-junction — dangerous and illegal.',
  stvo:'§ 9 Abs. 1 StVO' },

{ id:'bk-lane-indirect-busy', ch:3, title:'Busy multi-lane: use the indirect turn', de:'Belebte Mehrspurstraße: indirekt abbiegen',
  road:{lights:['S','N','E','W']},
  extras:[`<line x1="20" y1="320" x2="20" y2="85" stroke="var(--paint)" stroke-width="2" stroke-dasharray="18 12" stroke-linecap="round"/>`],
  actors:[
    {id:'you',kind:'you',from:'S',through:true},
    {id:'a',kind:'car',from:'N',through:true,label:'Oncoming — lane 1'},
    {id:'b',kind:'car',path:'M-10 -330 L-10 330',stop:0,through:true,delay:.5,label:'Oncoming — lane 2'}
  ],
  order:[['a','b'],['you']], duration:9,
  captions:['A busy multi-lane junction with two oncoming lanes. A direct left turn requires crossing both lanes at once — very risky if you misjudge.','Instead, do the indirect turn: go straight through with the green light, all the way to the far kerb.','Wait at the far corner facing your new direction. Go with the next green. Two stages — you never cross oncoming traffic.'],
  rule:'At a multi-lane junction, the indirect left turn (indirektes Linksabbiegen) is the safest choice. You never cut across oncoming lanes — go straight, wait, then proceed. Always allowed; often the only safe option on busy roads.',
  mistake:'Attempting a direct left turn across two oncoming lanes because you see a gap in the first lane. The second lane car is often hidden behind the first vehicle.',
  stvo:'§ 9 StVO' },

{ id:'bk-lane-both-gaps', ch:3, title:'Direct left: all oncoming lanes must clear', de:'Direktes Linksabbiegen: alle Spuren müssen frei sein',
  road:{},
  extras:[`<line x1="-20" y1="-320" x2="-20" y2="85" stroke="var(--paint)" stroke-width="2" stroke-dasharray="18 12" stroke-linecap="round"/>`],
  actors:[
    {id:'you',kind:'you',path:'M10 330 L10 72 C10 18 -38 2 -72 -30 L-330 -30',stop:258,indicator:-1,indFrom:.0},
    {id:'a',kind:'car',from:'N',through:true,label:'Oncoming — lane 1',delay:.1},
    {id:'b',kind:'car',path:'M-10 -330 L-10 330',stop:0,through:true,delay:1.1,label:'Oncoming — lane 2'}
  ],
  order:[['a','b'],['you']],
  captions:['You are in the left lane wanting to turn left. Two lanes of oncoming traffic approach — at different gaps.','The first lane clears. But the second lane still has a car. You must wait — a gap in one lane is not a gap in both.','Only when all oncoming lanes are simultaneously clear can you complete the turn.'],
  rule:'When turning left across multiple oncoming lanes, you need a gap in ALL of them at the same time. A clear near lane does not mean the far lane is safe. Commit to the turn only when the full road is empty.',
  mistake:'Starting the left turn as soon as the nearest lane clears. The far-lane car is often hidden in the first car\'s blind spot.',
  stvo:'§ 9 Abs. 3 StVO' },

{ id:'bk-single-lane-left', ch:3, title:'Single-lane road: direct left turn from bike lane', de:'Einspurige Straße: direktes Linksabbiegen',
  road:{bike:['NS']}, signs:[{code:'237',x:112,y:260,size:30}],
  actors:[
    {id:'you',kind:'you',path:'M82 330 L82 200 Q82 145 30 125 L30 72 C30 18 -36 8 -72 -30 L-330 -30',stop:278,indicator:-1,indFrom:.15},
    {id:'a',kind:'car',from:'N',through:true,label:'Oncoming car'},
    {id:'b',kind:'car',from:'S',through:true,delay:.5,label:'Car behind'}
  ],
  order:[['a'],['you'],['b']],
  captions:['Single-lane road with a bike lane. One lane each direction. You want to turn left.','Signal left early. Check your mirror, then merge from the bike lane into the centre of the road well before the junction.','Wait for the oncoming car to pass, then turn left. The car behind waits for you.'],
  rule:'On a single-lane road the direct left turn is practical: leave the bike lane early, signal left, merge to the centre, yield to oncoming traffic, then turn. This is the one case where merging into the car lane makes sense.',
  mistake:'Staying in the bike lane all the way to the junction and cutting across — you cross oncoming traffic at a diagonal from the wrong position.',
  stvo:'§ 9 Abs. 1 StVO' },

{ id:'bk-bikelane-left-indirect', ch:3, title:'2 car lanes + bike lane: indirect left turn', de:'2 Fahrstpuren + Radweg: indirektes Linksabbiegen',
  road:{bike:['NS'], lights:['S','N','E','W']},
  extras:[
    `<line x1="30" y1="320" x2="30" y2="85" stroke="var(--paint)" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round"/>`,
    `<rect x="68" y="-88" width="22" height="22" rx="3" fill="var(--go)" opacity="0.25" stroke="var(--go)" stroke-width="1.5" stroke-dasharray="4 3"/>`
  ],
  actors:[
    {id:'you',kind:'you',path:'M82 330 L82 -66 Q82 -86 58 -86 L-330 -86',stop:0,through:true,travel:5,indicator:-1,indFrom:.88},
    {id:'a',kind:'car',path:'M42 330 L42 -330',stop:0,through:true,label:'Lane 2 — straight'},
    {id:'b',kind:'car',path:'M18 330 L18 72 C18 15 -40 5 -72 -30 L-330 -30',stop:0,through:true,label:'Lane 1 — left turn',indicator:-1,indFrom:.0}
  ],
  order:[['a','b'],['you']], duration:13,
  captions:['Green light. Lane 1 turns left. Lane 2 goes straight. You are in the bike lane, also wanting to turn left.','The N-S traffic clears. Now you go: straight through the junction in your bike lane. You do not touch the car lanes.','Past the junction, you curve left at the far-right corner (green box) and exit west. That is your left turn — no lane changes at all.'],
  rule:'From the bike lane, wait for the N-S flow to clear, then go straight through and curve west at the far corner. You and the lane 1 car both end up heading west — but via completely different parts of the junction, at different times.',
  mistake:'Merging left into lane 1 to turn with the cars. Crossing lane 2 and lane 1 in moving traffic is dangerous — the indirect turn gets you to the same place safely.',
  stvo:'§ 9 StVO' },

{ id:'bk-bikelane-left-phase2', ch:3, title:'3 car lanes + bike lane: same indirect turn', de:'3 Fahrspuren + Radweg: gleiche Methode',
  road:{bike:['NS'], lights:['S','N','E','W']},
  extras:[
    `<line x1="20" y1="320" x2="20" y2="85" stroke="var(--paint)" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round"/>`,
    `<line x1="40" y1="320" x2="40" y2="85" stroke="var(--paint)" stroke-width="2" stroke-dasharray="14 10" stroke-linecap="round"/>`,
    `<rect x="68" y="-88" width="22" height="22" rx="3" fill="var(--go)" opacity="0.25" stroke="var(--go)" stroke-width="1.5" stroke-dasharray="4 3"/>`
  ],
  actors:[
    {id:'you',kind:'you',path:'M82 330 L82 -66 Q82 -86 58 -86 L-330 -86',stop:0,through:true,travel:5,indicator:-1,indFrom:.88},
    {id:'a',kind:'car',path:'M50 330 L50 -330',stop:0,through:true,label:'Lane 3 — straight'},
    {id:'b',kind:'car',path:'M28 330 L28 -330',stop:0,through:true,delay:.3,label:'Lane 2 — straight'},
    {id:'c',kind:'car',path:'M10 330 L10 72 C10 15 -40 5 -72 -30 L-330 -30',stop:0,through:true,label:'Lane 1 — left turn',indicator:-1,indFrom:.0}
  ],
  order:[['a','b','c'],['you']], duration:14,
  captions:['Three car lanes beside your bike lane — Lane 1 turns left, lanes 2 and 3 go straight. Green light.','The car lanes clear. You go straight through in your bike lane, same as before. Three lanes or two — your path is identical.','At the far-right corner, curve west. The number of car lanes does not change your procedure.'],
  rule:'No matter how many car lanes — 2, 3, or more — the indirect left turn from the bike lane is always the same: wait for N-S traffic to clear, go straight through, curve west at the far corner.',
  mistake:'Thinking that fewer cars on a given day makes it safe to merge across all lanes for a direct turn.',
  berlin:'Frankfurter Allee, Karl-Marx-Allee, and Schönhauser Allee all have 2–3 car lanes beside mandatory bike lanes. Indirect left turns are the norm.',
  stvo:'§ 9 StVO' },

// ===== Chapter 4: Traffic lights =====
{ id:'bk-ampel-red', ch:4, title:'Red light means stop — for cyclists too', de:'Rotlicht gilt auch für Radfahrer',
  road:{lights:['S']},
  actors:[{id:'you',kind:'you',from:'S'},{id:'a',kind:'car',from:'E',through:true,label:'Crossing traffic'}],
  order:[['a'],['you']],
  captions:['The light is red. Crossing traffic has green.','You must stop at the line — red applies to cyclists exactly as to cars.','Running a red light is a €60–100 fine. Wait for green.'],
  rule:'A red traffic light is binding for cyclists. There are no exceptions — not even at 3 a.m. on an empty road. Running red costs €60–100 and doubles if you endanger someone.',
  mistake:'Rolling slowly through a red because "the road is clear". Even a slow roll-through is a violation.',
  stvo:'§ 37 StVO' },
{ id:'bk-ampel-bike', ch:4, title:'Bike signal controls your phase', de:'Radfahrampel',
  road:{lights:['S']}, signs:[{code:'237',x:112,y:260,size:30}],
  actors:[{id:'you',kind:'you',path:'M48 330 L48 0',stop:262},{id:'a',kind:'car',from:'S',through:true,delay:.6,label:'Car (different phase)'}],
  order:[['you'],['a']],
  captions:['A separate bike signal (small signal with a bicycle symbol) controls your phase.','When the bike signal turns green you may go — even if the car signal is still red.','Your own bike signal controls you. Ignore the car signal.'],
  rule:'A dedicated bike signal (Radfahrampel) takes precedence over the adjacent car signal for cyclists. Go when your signal is green. If there is no bike signal, the regular car signal applies to you.',
  mistake:'Following the car signal when a separate bike signal exists — you may go when you should not, or wait unnecessarily.',
  stvo:'§ 37 StVO' },
{ id:'bk-aufstellflaeche', ch:4, title:'Advance box: filter to the front', de:'Aufstellfläche für Radfahrer',
  road:{lights:['S']},
  actors:[{id:'you',kind:'you',path:'M48 330 L48 0',stop:262},{id:'a',kind:'car',from:'S',delay:.5,label:'Car behind'}],
  order:[['you'],['a']], duration:8,
  captions:['A red light with a marked advance box for cyclists. The box is in front of the car stop line.','During red you may filter to the front and wait in the box. Cars stop behind the rear line.','When green, you set off first — before the cars.'],
  rule:'The advance box (Aufstellfläche) lets cyclists filter to the front during red. Stop within the box — not in front of it. The front line is your stop line.',
  mistake:'Stopping in front of the advance box — that is still running the red.',
  stvo:'§ 41 StVO, Zeichen 297' },
{ id:'bk-gruenpfeil', ch:4, title:'Green arrow: turn right on red', de:'Grüner Pfeil für Radfahrer',
  road:{lights:['S'],gruenpfeil:['S']}, signs:[{code:'720',x:112,y:58,size:30}],
  actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'a',kind:'car',from:'W',through:true,label:'Crossing traffic on green'}],
  order:[['a'],['you']],
  captions:['A small green arrow plate next to the red light.','You may turn right on red — but only after a full stop, and only if nobody is hindered.','Stop, look, yield to crossing traffic and pedestrians, then turn.'],
  rule:'The Grünpfeil (Zeichen 720) allows a right turn on red after a complete stop. It applies to cyclists and cars. You must yield to everyone — crossing traffic and pedestrians. A rolling stop is a violation.',
  mistake:'Treating the green arrow as a general permission to go. You must stop, look both ways, and turn only when clear.',
  stvo:'§ 37 Abs. 2 StVO, Zeichen 720' },

// ===== Chapter 5: Trams and dooring =====
{ id:'bk-tram-tracks', ch:5, title:'Cross tram tracks at a wide angle', de:'Straßenbahnschienen queren',
  road:{type:'straight'}, extras:[`<g><rect x="-320" y="-8" width="640" height="6" fill="#888" opacity=".5"/><rect x="-320" y="6" width="640" height="6" fill="#888" opacity=".5"/></g>`],
  actors:[{id:'you',kind:'you',path:'M-260 300 L200 -300',stop:0,through:true,travel:8}],
  order:[['you']], duration:8,
  captions:['Tram tracks cross your path. Approach at a wide angle — at least 45 degrees.','A narrow angle lets the track groove swallow your front wheel and throw you over the handlebars.','The wider the angle, the more your tyre rolls over the groove rather than into it.'],
  rule:'Cross tram tracks at a minimum 45-degree angle. If the angle is shallow, slow right down and cross quickly. Never brake on wet metal tracks — they are extremely slippery.',
  mistake:'Crossing at a shallow angle because it feels faster. Tram-track injuries are common in Berlin.',
  berlin:'Central Berlin and the east have dense tram networks. Friedrichstraße, Torstraße, Schönhauser Allee — all have tracks cyclists cross daily.',
  stvo:'§ 1 StVO (general duty of care)' },
{ id:'bk-dooring', ch:5, title:'The door zone: ride 1 metre out', de:'Dooring — die Türfalle',
  road:{type:'straight'},
  actors:[{id:'you',kind:'you',path:'M48 330 L48 -330',stop:0,through:true,travel:9},{id:'a',kind:'car',static:true,x:140,y:80,angle:180,label:'Parked car'}],
  order:[['you']], duration:9,
  captions:['Parked cars line the right side of the road.','Ride at least 1 metre from parked cars. A door can open at any moment without warning.','A door hit at cycling speed causes serious injuries. Give yourself room to see and react.'],
  rule:'Ride at least 1 m from the sides of parked cars. Look for movement inside the car — someone with a seatbelt off or a head turning is about to open a door. If you must pass closer, slow down.',
  mistake:'Riding in a Schutzstreifen stripe that hugs the parking lane. The stripe is sometimes in the door zone — move left if needed.',
  berlin:'Dooring is one of the leading causes of serious cycling injury in Berlin. Most streets with kerbside parking have doors swinging into the riding line.',
  stvo:'§ 14 StVO (obligation of the opener), § 1 StVO (duty of care for the cyclist)' },
{ id:'bk-tram-stop', ch:5, title:'Tram stop without an island', de:'Haltestelle ohne Mittelinsel',
  road:{type:'straight'}, signs:[{code:'224',x:86,y:200,size:34}],
  actors:[{id:'t',kind:'tram',from:'S',through:true,travel:4},{id:'you',kind:'you',path:'M82 330 L82 60',stop:80}],
  order:[['t'],['you']],
  captions:['A tram stops ahead. Passengers step directly from the tram onto the road — no island.','You must stop or slow to walking pace. Passengers alighting have priority.','Only continue once the doors are closed and passengers are clear.'],
  rule:'At a tram stop without a raised island, pedestrians cross the cycle path and road to board or alight. You must yield to them. If the tram shows hazard lights, it is stopping — slow immediately.',
  mistake:'Squeezing past a stopped tram at speed. People step off expecting the cycle path to be clear.',
  berlin:'Tram stops without islands are common on narrower streets in Prenzlauer Berg, Mitte and Friedrichshain.',
  stvo:'§ 20 StVO' },

// ===== Chapter 6: Special cases =====
{ id:'bk-oneway-free', ch:6, title:'One-way street open both ways for cyclists', de:'Einbahnstraße, Radverkehr frei',
  road:{oneway:{E:'out'}}, signs:[{code:'267',x:112,y:86,size:34},{code:'1022-10',x:112,y:130,size:30}],
  actors:[{id:'you',kind:'you',path:'M330 -30 L-330 -30',stop:262,through:true},{id:'a',kind:'car',from:'S',turn:'right',delay:.3,label:'Car turning in'}],
  order:[['you'],['a']],
  captions:['"No entry" — but the plate says "Radverkehr frei": you may ride against the one-way direction.','The car turning in must yield to you coming the wrong way.','Look for cars turning in — drivers may not expect a cyclist coming from that direction.'],
  rule:'"Radverkehr frei" under a no-entry sign opens the one-way for cyclists in the wrong direction. Everyone turning in must yield to you. Most Berlin residential one-way streets have this plate.',
  mistake:'Assuming all one-way streets are open to cyclists. Check for the plate — if it is missing, you must go the same way as cars.',

{ id:'bk-living-street', ch:6, title:'Living street: walking pace', de:'Verkehrsberuhigter Bereich',

  actors:[{id:'you',kind:'you',from:'S',through:true,travel:9},{id:'k1',kind:'ped',path:'M-90 -40 L60 -60 L90 -160',stop:0,through:true,travel:9,noIntent:true,label:'Child'},{id:'k2',kind:'ped',path:'M70 120 L-40 40 L-90 -120',stop:0,through:true,travel:9,noIntent:true,label:'Child'}],
  order:[['you']], duration:11,

  rule:'In a living street (Zeichen 325.1) you ride at walking pace. Pedestrians have full right of way. When exiting, you give way to all road users.',
  mistake:'Riding at 15 km/h because the road looks empty. Children appear suddenly.',
  stvo:'§ 42 StVO, Zeichen 325.1, § 10 StVO' },
{ id:'bk-sidewalk', ch:6, title:'Pavement riding is generally forbidden', de:'Fahren auf dem Gehweg',

  order:[['you']], duration:9,

  rule:'Cycling on the pavement is forbidden for adults unless a sign explicitly permits it. If you are allowed, walk pace only and pedestrians have priority.',

{ id:'bk-railway', ch:6, title:'Railway crossing', de:'Bahnübergang',

// ---- App: routing, views, player ----
const CHAPTERS = [
  { n:1, title:'Right-of-way at crossings', de:'Vorfahrt', desc:'Rechts-vor-Links, priority roads and give-way triangles — all apply to cyclists exactly as to cars.' },
  { n:2, title:'Bike infrastructure', de:'Radwege & Straßen', desc:'Mandatory cycle paths, dashed and solid lanes, bicycle streets — where you must ride and who yields.' },
  { n:3, title:'Turning', de:'Abbiegen', desc:'Right turns, direct and two-stage left turns, leaving the cycle lane, and navigating multi-lane roads safely.' },
  { n:4, title:'Traffic lights', de:'Ampeln', desc:'Bike signals, the advance box, the green arrow, and why red always means stop.' },
  { n:5, title:'Trams and dooring', de:'Straßenbahn & Türen', desc:'Crossing tram tracks, the door zone, and what to do at a tram stop without an island.' },
  { n:6, title:'Special cases', de:'Sonderfälle', desc:'One-way streets open both ways, living streets, sidewalk rules, and railway crossings.' },
];
const $ = (s,p)=> (p||document).querySelector(s);
const main = $('#main'), nav = $('#nav');
let player = null;

function route(){ const h = location.hash.replace('#','') || 'home'; const [k, v] = h.split('/');
  if(player){ player.stop(); player=null; }
  const fn = document.querySelector('.float-nav'); if(fn) fn.remove();
  if(k==='s') renderScene(v); else if(k==='ch') renderChapter(+v); else if(k==='signs') renderGlossary(); else renderHome();
  renderNav(k, v); window.scrollTo(0,0); }
window.addEventListener('hashchange', route);

function renderNav(k, v){
  const cur = k==='s' ? SCENES.find(s=>s.id===v) : null; const curCh = k==='ch' ? +v : cur ? cur.ch : null;
  nav.innerHTML = `<button data-h="home" ${k==='home'||k===''?'aria-current="true"':''}><span class="num">⌂</span>Start</button>
    <div class="eyebrow">Chapters</div>` +
    CHAPTERS.map(c=>`<button data-h="ch/${c.n}" ${curCh===c.n?'aria-current="true"':''}><span class="num">${c.n}</span><span>${c.title}</span><span class="cnt">${SCENES.filter(s=>s.ch===c.n).length}</span></button>`).join('') +
    `<div class="sep"></div><button data-h="signs" ${k==='signs'?'aria-current="true"':''}><span class="num">▲</span>Sign glossary</button>`;
  nav.querySelectorAll('button').forEach(b=> b.onclick=()=> location.hash = b.dataset.h);
}

function thumb(scene, t){ const svg = document.createElementNS(NS,'svg'); const v = new SceneView(svg, scene); v.quizHidden=true; v.setTime(t==null?T_ARRIVE+0.1:t); v.actors.forEach(a=>{ if(a.intent){ a.intent.setAttribute('opacity',.7); a.intentHead.setAttribute('opacity',.7);} }); return svg; }

function renderHome(){
  main.innerHTML = `<div class="hero"><div>
      <div class="crumb">Berlin · cycling guide</div>
      <h2>Rules of the road for Berlin cyclists</h2>
      <p>${SCENES.length} animated situations from the streets of Berlin. <b style="color:var(--go)">You are always the green cyclist</b>. Press play, watch who waits and who goes, then try quiz mode.</p>
      <p>Rules follow the German StVO as of 2026; the Berlin notes cover what is specific to cycling here — tram tracks, door zones, one-way streets open both ways, and bicycle streets.</p>
      <p><button class="controls-inline" id="startBtn" style="background:var(--go);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;margin-top:6px">Start with chapter 1 →</button></p>
    </div><div class="stage" id="heroStage"></div></div>
    <div class="card" style="margin-bottom:22px"><h3>How to read the scenes</h3><div class="legend">
      <div><i style="background:${COL.you};border-radius:50%;height:14px"></i>You (cyclist)</div><div><i style="background:${COL.cars[0]}"></i>Cars</div><div><i style="background:${COL.bvg}"></i>Tram / BVG bus</div><div><i style="background:${COL.bike};border-radius:50%;height:14px"></i>Other cyclists</div><div><i style="background:${COL.ped};border-radius:50%;height:14px;border:2px solid #444"></i>Pedestrian</div>
      <div><i class="badge" style="background:var(--wait)">WARTEN</i>Must wait</div><div><i class="badge" style="background:var(--go)">1</i>Goes first</div><div><i style="width:22px;height:0;border-top:3px dashed ${COL.cars[3]}"></i>Intended path</div>
    </div></div>
    <div class="section-title">Chapters</div>
    <div class="chapters">${CHAPTERS.map(c=>`<button data-h="ch/${c.n}"><span class="num">CHAPTER ${c.n}</span><span class="t">${c.title}</span><span class="d">${c.desc}</span><span class="c">${SCENES.filter(s=>s.ch===c.n).length} scenes</span></button>`).join('')}</div>`;
  main.querySelectorAll('[data-h]').forEach(b=> b.onclick=()=> location.hash=b.dataset.h);
  $('#startBtn').onclick = ()=> location.hash = 's/'+SCENES.find(s=>s.ch===1).id;
  const demo = SCENES.find(s=>s.id==='bk-rvl-3way') || SCENES[0];
  const svg = document.createElementNS(NS,'svg'); $('#heroStage').appendChild(svg);
  player = new Player(new SceneView(svg, demo), null); player.loop = true; player.play();
}

function renderChapter(n){
  const c = CHAPTERS.find(x=>x.n===n); const list = SCENES.filter(s=>s.ch===n);
  main.innerHTML = `<div class="crumb">Chapter ${n} · <i>${c.de}</i></div><div class="scene-head"><h2>${c.title}</h2><p class="de">${c.desc}</p></div>
    <div class="scenelist" style="margin-top:18px">${list.map(s=>`<button data-id="${s.id}"><div class="th"></div><div class="t">${s.title}<span class="de">${s.de||''}</span></div></button>`).join('')}</div>`;
  main.querySelectorAll('[data-id]').forEach((b,i)=>{ b.querySelector('.th').appendChild(thumb(list[i])); b.onclick=()=> location.hash='s/'+b.dataset.id; });
}

function renderGlossary(){
  main.innerHTML = `<div class="crumb">Reference</div><div class="scene-head"><h2>Sign glossary</h2><p class="de">Every sign used in the scenes, with its official number. Tap "used in" to jump to a situation.</p></div>
    <div class="gloss" style="margin-top:18px">${Object.keys(SIGNS).map(code=>{ const s=SIGNS[code]; const used = SCENES.filter(sc=>(sc.signs||[]).some(x=>x.code===code));
      return `<div class="g">${signSVG(code,56)}<div><b>${s.name}</b><span class="code">${/^\d/.test(code)?'Zeichen '+code:''}</span><p><b style="color:var(--ink)">${s.en}.</b> ${s.desc}</p>${used.length?`<p>Used in: ${used.slice(0,3).map(u=>`<a href="#s/${u.id}">${u.title}</a>`).join(' · ')}</p>`:''}</div></div>`; }).join('')}</div>`;
}

const BASE_RATE = 0.7; // global playback pace (1 = real-time of the scene timeline)
const ICON = { play:'<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>', pause:'<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>', step:'<svg viewBox="0 0 16 16"><path d="M3 2l8 6-8 6zM12 2h2v12h-2z"/></svg>', replay:'<svg viewBox="0 0 16 16"><path d="M8 3a5 5 0 1 1-4.5 2.8l1.8.9A3 3 0 1 0 8 5v2L4 4l4-3z"/></svg>' };

function renderScene(id){
  const idx = SCENES.findIndex(s=>s.id===id); if(idx<0){ location.hash='home'; return; }
  const s = SCENES[idx], c = CHAPTERS.find(x=>x.n===s.ch); const prev = SCENES[idx-1], next = SCENES[idx+1];
  const chIdx = SCENES.filter(x=>x.ch===s.ch).findIndex(x=>x.id===id)+1, chCount = SCENES.filter(x=>x.ch===s.ch).length;
  try{ localStorage.setItem('bk-bike-last', id); }catch(e){}
  main.innerHTML = `<div class="topbar"><div class="crumb">Chapter ${s.ch} · <b>${c.title}</b></div><div class="progress">scene ${chIdx} / ${chCount} · ${idx+1} of ${SCENES.length}</div></div>
    <div class="scene-head"><h2>${s.title}</h2><p class="de">${s.de||''}</p></div>
    <div class="grid">
      <div>
        <div class="stage"><svg id="stage"></svg>
          <div class="timeline" id="tl"><i></i></div>
          <div class="caption" id="cap"></div>
          <div class="quiz hidden" id="quiz"></div>
          <div class="controls">
            <button class="primary" id="btnPlay">${ICON.play} Play</button>
            <button id="btnStep" title="Jump to the next moment">${ICON.step} Step</button>
            <button id="btnReplay">${ICON.replay} Replay</button>
            <button id="btnSpeed" title="Slow motion">½×</button>
            <span class="spacer"></span>
            <button id="btnQuiz" title="Hide the answer and guess first">Quiz mode</button>
          </div>
        </div>
      </div>
      <div class="explain">
        <div class="card rule"><h3>The rule</h3>${s.rule.split('\n').map(p=>`<p>${p}</p>`).join('')}${s.stvo?`<span class="stvo">${s.stvo}</span>`:''}</div>
        ${s.mistake?`<div class="card mistake"><h3>Common mistake</h3><p>${s.mistake}</p></div>`:''}
        ${s.berlin?`<div class="card berlin"><h3>Berlin note</h3><p>${s.berlin}</p></div>`:''}
        ${(s.signs&&s.signs.length)?`<div class="card"><h3>Signs in this scene</h3><div class="signs">${[...new Set(s.signs.map(x=>x.code))].map(code=>`<div class="s">${signSVG(code,38)}<div><b>${SIGNS[code].name}</b><span>${SIGNS[code].en}</span></div></div>`).join('')}</div></div>`:''}
      </div>
    </div>
    <div class="pager">${prev?`<button id="prevBtn"><small>← Previous</small><span>${prev.title}</span></button>`:'<span></span>'}${next?`<button id="nextBtn" class="next"><small>Next →</small><span>${next.title}</span></button>`:''}</div>`;
  if(prev) $('#prevBtn').onclick=()=> location.hash='s/'+prev.id; if(next) $('#nextBtn').onclick=()=> location.hash='s/'+next.id;
  // floating desktop nav
  const fn = document.createElement('div'); fn.className='float-nav';
  if(prev){ const b=document.createElement('button'); b.className='fn-prev'; b.textContent='← '+prev.title.slice(0,28); b.onclick=()=>location.hash='s/'+prev.id; fn.appendChild(b); }
  if(next){ const b=document.createElement('button'); b.className='fn-next'; b.textContent=next.title.slice(0,28)+' →'; b.onclick=()=>location.hash='s/'+next.id; fn.appendChild(b); }
  document.body.appendChild(fn);
  const view = new SceneView($('#stage'), s);
  player = new Player(view, { tl:$('#tl'), cap:$('#cap'), quiz:$('#quiz'), play:$('#btnPlay'), step:$('#btnStep'), replay:$('#btnReplay'), speed:$('#btnSpeed'), quizBtn:$('#btnQuiz') });
  try{ if(localStorage.getItem('bk-quiz')==='1') player.setQuiz(true); }catch(e){}
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce) player.play();
}

class Player {
  constructor(view, ui){ this.view=view; this.ui=ui; this.speed=1; this.playing=false; this.loop=false; this.quiz=false; this.quizAsked=false; this.t=0; this.last=null; this._capIdx=-1; this.render(0);
    if(ui){ ui.play.onclick=()=> this.playing? this.pause(): this.play(); ui.step.onclick=()=> this.step(); ui.replay.onclick=()=> this.replay(); ui.speed.onclick=()=> this.toggleSpeed(); ui.quizBtn.onclick=()=> this.setQuiz(!this.quiz);
      const kf = view.keyframes; ui.tl.innerHTML='<i></i>'+kf.map(k=>`<b style="left:${(k/view.duration*100).toFixed(1)}%"></b>`).join('');
      ui.tl.onclick=(e)=>{ const r=ui.tl.getBoundingClientRect(); this.t = (e.clientX-r.left)/r.width*view.duration; this.render(this.t); }; }
  }
  play(){ if(this.t>=this.view.duration-0.01) this.t=0; this.playing=true; this.last=null; if(this.ui) this.ui.play.innerHTML=ICON.pause+' Pause'; this.raf=requestAnimationFrame(ts=>this.tick(ts)); }
  pause(){ this.playing=false; cancelAnimationFrame(this.raf); if(this.ui) this.ui.play.innerHTML=ICON.play+' Play'; }
  stop(){ this.pause(); }
  replay(){ this.t=0; this.quizAsked=false; this._capIdx=-1; if(this.quiz){ this.view.quizHidden=true; this.ui.quiz.classList.add('hidden'); } this.render(0); this.play(); }
  step(){ const kf=this.view.keyframes; const nxt = kf.find(k=>k>this.t+0.05); this.pause(); this.t = nxt!=null? nxt : this.view.duration; this.render(this.t); }
  toggleSpeed(){ this.speed = this.speed===1? .5 : 1; this.ui.speed.classList.toggle('on', this.speed!==1); }
  setQuiz(on){ this.quiz=on; try{ localStorage.setItem('bk-quiz', on?'1':'0'); }catch(e){} this.ui.quizBtn.classList.toggle('on',on); this.replay(); if(!on){ this.view.quizHidden=false; this.ui.quiz.classList.add('hidden'); this.render(this.t);} }
  tick(ts){ if(!this.playing) return; if(this.last==null) this.last=ts; const dt=(ts-this.last)/1000*this.speed*BASE_RATE; this.last=ts; this.t+=dt;
    if(this.quiz && !this.quizAsked && this.t>=T_ARRIVE+0.3){ this.t=T_ARRIVE+0.3; this.render(this.t); this.askQuiz(); return; }
    if(this.t>=this.view.duration){ this.t=this.view.duration; this.render(this.t); if(this.loop){ this.t=0; } else { this.pause(); return; } }
    this.render(this.t); this.raf=requestAnimationFrame(ts2=>this.tick(ts2)); }
  render(t){ const v=this.view; v.setTime(t); if(!this.ui) return; this.ui.tl.firstChild.style.width=(t/v.duration*100)+'%';
    const caps = v.scene.captions||[]; let ci=0; for(let i=1;i<caps.length;i++){ if(v.capTimes[i]!=null && t>=v.capTimes[i]) ci=i; }
    if(this.quiz && v.quizHidden && ci>0) ci=0;
    const text = caps[ci]||'';
    if(ci !== this._capIdx){ this._capIdx=ci; const cap=this.ui.cap; cap.classList.remove('cap-enter'); const inner=text?'<span class="stepno">'+(ci===0?'start':'step '+ci)+'</span><span>'+text+'</span>':''; cap.textContent=''; if(inner){ cap.insertAdjacentHTML('beforeend',inner); void cap.offsetWidth; cap.classList.add('cap-enter'); } }
  }
  askQuiz(){ this.pause(); this.quizAsked=true; const v=this.view, s=v.scene; const q = s.quiz||{}; const ans = q.answer || (s.order&&s.order[0]) || [];
    const opts = (q.options || v.actors.filter(a=>!a.static && a.def.kind!=='ped').map(a=>a.id));
    this.ui.quiz.classList.remove('hidden');
    this.ui.quiz.innerHTML = `<p>${q.q||'Who goes first?'}</p><div class="opts">${opts.map(id=>{ const a=v.actors.find(x=>x.id===id); return `<button data-id="${id}"><span class="dot" style="background:${a?a.color:'#999'}"></span>${a&&a.def.label?a.def.label:id==='you'?'You (cyclist)':id}</button>`; }).join('')}</div><div class="fb"></div>`;
    this.ui.quiz.querySelectorAll('button').forEach(b=> b.onclick=()=>{ const ok = ans.length===0 || ans.includes(b.dataset.id); const fb=this.ui.quiz.querySelector('.fb'); fb.className='fb '+(ok?'ok':'no'); fb.textContent = ok? '✓ Correct. ' + (q.why||'Watch the animation to see the full order.') : '✗ Not quite. ' + (q.why||'Watch who actually goes first.'); v.quizHidden=false; this.ui.quiz.querySelectorAll('button').forEach(x=>x.disabled=true); setTimeout(()=>this.play(), 900); }); }
}

// boot
route();

</script>
