  rule:'A mini roundabout is a real roundabout: circle traffic first, no indicator in, indicator out. Only vehicles that physically cannot make the turn (buses, lorries) may drive over the painted centre. Cars drive round it.',
  mistake:'Cutting straight across the painted island in a car.',
  stvo:'§ 8 Abs. 1a StVO, § 9a Abs. 1 StVO' },
{ id:'r-nosign', ch:6, title:'A circle without the roundabout sign', de:'Kreisel ohne Zeichen 215: Rechts vor Links',
  road:{type:'round'}, actors:[{id:'you',kind:'you',from:'W',turn:'r2',stop:340,label:'You, already in the circle'},{id:'b',kind:'car',from:'S',turn:'r2',label:'Car entering from the right'}],
  order:[['b'],['you']],
  captions:['A round junction, but no blue roundabout sign and no triangle at the entries.','Then it is an ordinary crossing: right-before-left. The car entering from your right goes first, although you are already inside!','Only after it has entered do you continue. Here you must signal when entering and leaving.'],
  rule:'Without sign 215 the circle is not a roundabout in law. Right-before-left applies at each entry, which means entering cars (from the right) have priority over circling cars. This is rare but exists on old squares. Look for the sign — no sign, no roundabout rules.',
  mistake:'Assuming every circular junction is a roundabout.',
  stvo:'§ 8 Abs. 1 StVO' },

// ===== Chapter 7: Trams and buses =====
{ id:'tr-left', ch:7, title:'Turning left across tram tracks', de:'Linksabbiegen über Straßenbahngleise',
  road:{tracks:'NS',tracksCenter:true}, signs:[{code:'306',at:'S'},{code:'306',at:'N'}],
  actors:[{id:'you',kind:'you',path:'M40 330 L40 72 C40 18 -30 8 -72 -30 L-330 -30',stop:258,indicator:-1},{id:'tr',kind:'tram',path:'M-14 -400 L-14 400',stop:262,through:true,label:'Oncoming tram'},{id:'tr2',kind:'tram',path:'M14 460 L14 -400',stop:262,through:true,delay:1.6,label:'Tram from behind'}],
  order:[['tr'],['tr2'],['you']],
  captions:['You want to turn left. Trams run in the middle of the road.','Turning drivers let trams pass — from the front and from behind. The oncoming tram goes first.','A tram also comes up behind you on the tracks. Let it pass too.','Then turn — quickly and completely off the tracks.'],
  rule:'Whoever turns must let rail vehicles pass, whichever direction they come from — including a tram catching up from behind on tracks in the middle of the road. Never wait for oncoming traffic while standing on the tracks; wait before them.',
  mistake:'Waiting for a gap in oncoming traffic with the car standing on the tram tracks.',
  berlin:'East Berlin (Prenzlauer Berg, Friedrichshain, Mitte, Pankow, Köpenick) is tram territory. Tracks in the middle of the road are normal on streets like Prenzlauer Allee or Warschauer Straße.',
  stvo:'§ 9 Abs. 3 StVO' },
{ id:'tr-stop', ch:7, title:'Tram stop without an island', de:'Haltestelle ohne Haltestelleninsel',
  road:{type:'straight',tracks:'NS'}, signs:[{code:'224',x:86,y:60,size:30}],
  actors:[{id:'tr',kind:'tram',path:'M30 60 L30 -400',stop:0,travel:2.4,label:'Tram at the stop'},{id:'you',kind:'you',path:'M46 330 L46 -330',stop:190,travel:4.8},{id:'p1',kind:'ped',path:'M100 90 L50 90',stop:0,noIntent:true,fadeOut:true,label:'Passenger'},{id:'p2',kind:'ped',path:'M100 20 L50 20',stop:0,delay:.5,noIntent:true,fadeOut:true,label:'Passenger'},{id:'p3',kind:'ped',path:'M48 50 L100 50',stop:0,delay:.3,noIntent:true,label:'Passenger'}],
  order:[['p1','p2','p3'],['tr','you']],
  captions:['A tram stops at a stop where passengers step straight off onto the road.','Stop behind the tram and wait. Passengers cross your lane to and from the door.','When the doors close and the tram moves, you may drive on — slowly.'],
  rule:'At a tram stop without a platform island, passengers walk across the road. You may pass a stopped tram on the right only at walking pace, and only if nobody can be endangered — in practice: stop and wait until the doors are closed. Never squeeze past on the left.',
  mistake:'Creeping past the open doors. People step out without looking, especially children.',
  berlin:'Typical at older stops in Pankow, Weißensee or Köpenick where the tracks run in the road. Watch for the yellow H sign and a waiting crowd.',
  stvo:'§ 20 Abs. 2 StVO' },
{ id:'bus-out', ch:7, title:'A bus pulls out of its stop', de:'Bus fährt von der Haltestelle ab',
  road:{type:'straight',busStop:'S'},
  actors:[{id:'bus',kind:'bus',path:'M46 200 L46 110 Q46 80 30 50 L30 -330',stop:0,indicator:-1,signalAlways:true,label:'BVG bus'},{id:'you',kind:'you',from:'S',stop:80}],
  order:[['bus'],['you']],
  captions:['A bus stands at a marked stop with its left indicator on.','In town you must let a bus pull out of a marked stop. Slow down or stop — do not overtake it now.','Once it has merged, follow at a safe distance.'],
  rule:'Inside built-up areas, a bus that signals to leave a marked stop must be let out. Do not overtake it as it signals; if needed, wait. Outside town this rule does not apply.',
  mistake:'Accelerating to get past before the bus moves.',
  berlin:'BVG drivers use this rule confidently. If the indicator is on, assume the bus will go now.',
  stvo:'§ 20 Abs. 5 StVO' },
{ id:'bus-hazard', ch:7, title:'Bus with hazard lights at the stop', de:'Bus mit Warnblinklicht',
  road:{type:'straight',busStop:'S'},
  actors:[{id:'bus',kind:'bus',static:true,x:46,y:160,angle:0,hazard:true,label:'Bus with hazard lights'},{id:'p',kind:'ped',path:'M100 226 L-100 226',stop:0,noIntent:true,label:'Passenger crossing'},{id:'you',kind:'you',path:'M30 330 L30 250 Q30 215 -2 205 L-2 115 Q-2 85 30 75 L30 -330',stop:70,travel:6},{id:'o',kind:'car',from:'N',through:true,travel:6,delay:3.2,label:'Oncoming car'}],
  order:[['p'],['you','o']], duration:12,
  captions:['A bus stands at the stop with its hazard lights flashing. A passenger crosses behind it.','Walking pace only, in both directions, with room to stop. Passengers may not be hindered — wait if needed.','Pass slowly. The oncoming car must crawl too.'],
  rule:'Hazard lights on a bus at a stop mean: pass only at walking pace, keep enough distance, and stop if passengers are crossing. This applies to you and to oncoming traffic. While a bus with hazard lights is still driving toward its stop you may not overtake it at all.',
  mistake:'Passing at 30 km/h because "nobody was visible". The point is that people appear from behind the bus.',
  stvo:'§ 20 Abs. 3 und 4 StVO' },
{ id:'bus-lane', ch:7, title:'Turning right across a bus lane', de:'Rechtsabbiegen über den Bussonderfahrstreifen',
  road:{busLane:['S'],oneway:{S:'in'}}, signs:[{code:'245',x:86,y:150,size:32}],
  actors:[{id:'you',kind:'you',path:'M-20 330 L-20 80 Q-20 30 30 30 L330 30',stop:250,indicator:1},{id:'bus',kind:'bus',path:'M30 330 L30 -330',through:true,delay:.3,label:'Bus in the bus lane'},{id:'bk',kind:'bike',path:'M46 330 L46 -330',through:true,delay:1.1,label:'Cyclist in the bus lane'}],
  order:[['bus','bk'],['you']],
  captions:['You want to turn right, but a bus lane runs between you and the corner.','Buses (and usually taxis and cyclists) in the bus lane go straight and have priority. You wait in your lane, indicator on.','When the lane is clear, cross it and turn.'],
  rule:'A bus lane is not yours to drive in, but you may cross it to turn right or to reach a parking space. Everything in the bus lane — buses, taxis, cyclists — goes before you. Do not merge into it early to "get in line".',
  mistake:'Driving in the bus lane for the last 50 m before the turn. Cameras on Berlin buses record this.',
  berlin:'Berlin bus lanes are usually open to taxis and bicycles (see the plate). Expect fast cyclists there.',
  stvo:'§ 41 StVO, Zeichen 245, § 9 Abs. 3 StVO' },
{ id:'tr-left-unsigned', ch:7, title:'Tram from the left at an unsigned crossing', de:'Straßenbahn von links ohne Schilder',
  road:{tracks:'EW'}, actors:[{id:'you',kind:'you',from:'S'},{id:'tr',kind:'tram',from:'W',label:'Tram from the left',travel:3.4}],
  order:[['you'],['tr']],
  captions:['No signs. A tram approaches from your left.','By the rule you have priority — the tram is on your left. But a tram cannot stop quickly. Make sure it has really slowed before you go.','Then the tram continues. In doubt, let it go: a tram always wins a collision.'],
  rule:'At a crossing without signs, trams follow right-before-left like everyone else. A tram from your left must let you go — but you should only insist on it when you are certain the driver has seen you and is stopping. Trams need up to 40 m to stop.',
  mistake:'Either extreme: braking hard for a tram that is stopping anyway, or driving in front of one that is not.',
  berlin:'In practice almost every Berlin tram crossing has signs or lights that favour the tram. This rule is mostly for the theory exam — and for the odd unsigned crossing in Köpenick or Pankow.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'tr-overtake', ch:7, title:'Passing a tram: on the right', de:'Straßenbahn rechts überholen',
  road:{type:'straight',tracks:'NS',tracksCenter:true},
  actors:[{id:'tr',kind:'tram',path:'M14 330 L14 -330',stop:0,through:true,travel:9,label:'Tram'},{id:'you',kind:'you',path:'M44 330 L44 -330',stop:200,travel:3}],
  order:[['you']],
  captions:['A tram runs slowly in the middle of the road ahead of you.','You pass a tram on the right — never on the left, unless the tracks run at the very right edge of the road or you are in a one-way street.'],
  rule:'Trams are passed on the right. On the left only if the tracks are so far right that there is no room, or in a one-way street. When passing, watch the doors and any stop ahead.',
  mistake:'Overtaking a tram on the left across oncoming tracks.',
  stvo:'§ 5 Abs. 7 StVO' },

// ===== Chapter 8: Cyclists and pedestrians =====
{ id:'c-fahrradstrasse', ch:8, title:'Bicycle street: you are a guest', de:'Fahrradstraße',
  road:{type:'straight',fahrrad:true}, signs:[{code:'244.1',x:86,y:230},{code:'kfzfrei',x:86,y:274,size:34}],
  actors:[{id:'b1',kind:'bike',path:'M20 250 L20 -330',stop:0,through:true,travel:8,label:'Cyclist'},{id:'b2',kind:'bike',path:'M42 240 L42 -330',stop:0,through:true,travel:8,label:'Cyclist'},{id:'you',kind:'you',from:'S',stop:0,through:true,travel:9.4}],
  order:[['b1','b2','you']], duration:11,
  captions:['A bicycle street ("Fahrradstraße"). The plate says cars are allowed — as guests.','Two cyclists ride side by side. That is allowed here. You may not overtake unless you can keep 1.5 m — so you stay behind at their pace, max 30 km/h.'],
  rule:'In a bicycle street bicycles set the pace: they may ride side by side, everyone drives at most 30 km/h, and cars may only enter if a plate allows it. Overtaking needs 1.5 m side distance, which is usually impossible — so you follow. Honking or tailgating is a fine.',
  mistake:'Squeezing past cyclists with 50 cm to spare.',
  berlin:'Berlin has dozens of bicycle streets: Linienstraße, Bergmannstraße stretches, Stargarder Straße, parts of Kreuzberg and Friedrichshain. Many have "Anlieger frei" — only if you are going somewhere on that street.',
  stvo:'§ 41 StVO, Zeichen 244.1, § 5 Abs. 4 StVO' },
{ id:'c-schutzstreifen', ch:8, title:'Overtaking a cyclist: 1.5 metres or wait', de:'Schutzstreifen und Seitenabstand',
  road:{type:'straight',bikeLane:['S']},
  actors:[{id:'bk',kind:'bike',path:'M48 120 L48 -120',stop:0,through:true,travel:9,label:'Cyclist on the dashed lane'},{id:'o',kind:'car',from:'N',through:true,label:'Oncoming car'},{id:'you',kind:'you',path:'M30 330 L30 150 Q30 110 -10 90 L-10 -120 Q-10 -160 30 -190 L30 -330',stop:160,travel:3.4}],
  order:[['o'],['you']],
  captions:['A cyclist rides on the dashed "Schutzstreifen". A car is coming toward you.','To overtake with 1.5 m side distance you would have to cross the centre line — impossible while the oncoming car is there. Wait behind the cyclist.','Now there is room: move out, pass with 1.5 m, and move back in without cutting the cyclist off.'],
  rule:'Overtaking a cyclist inside town requires at least 1.5 m side distance (2 m outside town). If that is not possible, you wait behind. The dashed lane may be crossed by cars only when necessary and without endangering the cyclist; the solid-line version (Radfahrstreifen) may not be crossed at all.',
  mistake:'"Just squeezing past" — the police in Berlin measure this with camera bikes.',
  stvo:'§ 5 Abs. 4 StVO, § 42 StVO (Zeichen 340)' },
{ id:'c-zebra', ch:8, title:'Zebra crossing', de:'Fußgängerüberweg',
  road:{type:'straight',zebra:['S']}, signs:[{code:'350',x:86,y:140,size:32}],
  actors:[{id:'you',kind:'you',from:'S',stop:186},{id:'p',kind:'ped',path:'M132 100 L-132 100',stop:0,noIntent:true,label:'Pedestrian at the zebra'}],
  order:[['p'],['you']],
  captions:['A pedestrian waits at the edge of a zebra crossing.','Anyone who visibly wants to cross has priority: brake early and stop before the stripes. Never overtake at a zebra crossing.','When the crossing is free, drive on.'],
  rule:'At a zebra crossing pedestrians (and people in wheelchairs) who want to cross go first — you must let them, stop if needed, and approach slowly enough to stop. Overtaking is forbidden at the crossing. Cyclists riding across do not have priority unless they get off and push.',
  mistake:'Waving a pedestrian across while the oncoming lane keeps driving. Stop, and let the pedestrian judge the other lane.',
  stvo:'§ 26 StVO' },
{ id:'c-calmed', ch:8, title:'Living street: walking pace', de:'Verkehrsberuhigter Bereich',
  road:{type:'straight',calmed:true}, signs:[{code:'325.1',x:86,y:260}],
  actors:[{id:'you',kind:'you',from:'S',stop:0,travel:9},{id:'k1',kind:'ped',path:'M-90 -40 L60 -60 L90 -160',stop:0,through:true,travel:9,noIntent:true,label:'Child'},{id:'k2',kind:'ped',path:'M70 120 L-40 40 L-90 -120',stop:0,through:true,travel:9,noIntent:true,label:'Child'},{id:'ball',kind:'ped',path:'M-70 130 L112 50',stop:0,travel:2.6,noIntent:true,color:'#e7712b',label:'Ball'}],
  order:[['ball'],['you']], duration:12,
  captions:['A living street: no pavement, the whole street is shared. Children are playing.','Walking pace — about 7 km/h — and be ready to stop at any moment. Pedestrians may use the whole width and must not be hindered; parking is only allowed in marked spaces.'],
  rule:'In a traffic-calmed area (blue sign with the playing child) you drive at walking pace, pedestrians and playing children may use the full street, and you must stop for them if needed. When you leave the area you give way to everyone.',
  mistake:'Driving 20 km/h because "nobody is around". Balls come first, children second.',
  stvo:'§ 42 StVO, Zeichen 325.1, § 10 StVO' },
{ id:'c-contra', ch:8, title:'One-way street open for cyclists in both directions', de:'Einbahnstraße, Radverkehr frei',
  road:{oneway:{E:'out'}}, signs:[{code:'267',x:112,y:86,size:34},{code:'1022-10',x:112,y:130,size:30}],
  actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'bk',kind:'bike',path:'M330 -30 L-330 -30',stop:262,through:true,label:'Cyclist coming against the one-way'}],
  order:[['bk'],['you']],
  captions:['You turn right into a one-way street. The "no entry" sign carries a plate: bicycles allowed.','So cyclists may come toward you out of that street. This one comes from your right — it goes first.','Look right along the one-way street before you turn.'],
  rule:'"Radverkehr frei" under a no-entry sign opens the one-way street for cyclists in the wrong direction. When turning into or crossing such a street, expect bikes from the direction where you "know" nothing can come.',
  mistake:'Only looking left when turning right into a one-way street.',
  berlin:'Most Berlin one-way streets in residential areas are open for cyclists both ways. Assume it unless you see otherwise.',
  stvo:'§ 41 StVO, Zusatzzeichen 1022-10' },
{ id:'c-escooter', ch:8, title:'E-scooters count as bicycles', de:'E-Scooter im Verkehr',
  road:{bike:['NS']}, actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'sc',kind:'bike',from:'S',turn:'bike',delay:.4,color:'#9c6bd6',label:'E-scooter on the cycle path'}],
  order:[['sc'],['you']],
  captions:['An e-scooter rider zips along the cycle path on your right as you want to turn.','E-scooters follow bicycle rules: the rider going straight has priority over your turn.','Shoulder check, then turn.'],
  rule:'E-scooters (Elektrokleinstfahrzeuge) use cycle paths and follow cycle rules. They are fast (20 km/h), quiet and small — treat every right turn across a cycle path as if a bike could appear.',
  mistake:'Underestimating how quickly a scooter covers the distance from "far away" to your bumper.',
  berlin:'Rental scooters are everywhere in inner-city Berlin, often ridden by tourists who do not know the rules. Give them extra room.',
  stvo:'§ 9 Abs. 3 StVO, eKFV' },

// ===== Chapter 9: Special cases =====
{ id:'sp-driveway', ch:9, title:'Leaving a car park onto the road', de:'Aus der Ausfahrt auf die Straße',
  road:{type:'straight',driveway:{y:150,label:'Ausfahrt'},bike:['NS']},
  actors:[{id:'you',kind:'you',path:'M200 150 L106 150 L60 150 Q-30 150 -30 200 L-30 330',stop:94,indicator:-1,signalAlways:true},{id:'bk',kind:'bike',from:'S',turn:'bike',through:true,label:'Cyclist on the cycle path'},{id:'n',kind:'car',from:'N',through:true,delay:.6,label:'Car on the road'}],
  order:[['bk','n'],['you']],
  captions:['You leave a car park and want to turn left onto the road.','First stop before the cycle path: cyclists and pedestrians on the pavement go first. Then cars on the road in both directions.','Only when everything is clear do you pull out — slowly, if needed with someone guiding you.'],
  rule:'Leaving a property you must make sure nobody is endangered: stop before the pavement and cycle path, look both ways, then look at the road. Signal your direction. You have no priority against anyone — not even a pedestrian on the pavement.',
  mistake:'Rolling across the pavement while looking only at the road.',
  stvo:'§ 10 StVO' },
{ id:'sp-rail', ch:9, title:'Railway crossing: trains always first', de:'Bahnübergang mit Andreaskreuz',
  road:{type:'straight',rail:true}, signs:[{code:'201',x:86,y:60,size:36},{code:'151',x:86,y:260,size:34}],
  actors:[{id:'tr',kind:'tram',path:'M-400 0 L400 0',stop:262,through:true,label:'Train / tram on its own track'},{id:'you',kind:'you',from:'S',stop:290}],
  order:[['tr'],['you']],
  captions:['Tracks cross the road. The Andreaskreuz sign marks the crossing.','Rail vehicles always have priority. Stop at the cross (or the line) and look and listen.','Cross only if you can clear the tracks completely — never stop on them, even in a queue.'],
  rule:'At an Andreaskreuz, trains and trams on their own track have absolute priority. Approach at moderate speed, do not overtake before the crossing, and never enter if traffic ahead might make you stop on the tracks.',
  mistake:'Following the car ahead onto the crossing when the queue is not moving.',
  berlin:'S-Bahn crossings are rare, but tram lines in Köpenick, Adlershof and Pankow run on their own track across side streets with exactly this sign.',
  stvo:'§ 19 StVO, Zeichen 201' },
{ id:'sp-ambulance', ch:9, title:'Blue lights and siren', de:'Blaulicht mit Martinshorn',
  road:{lights:['S','W'],stop:['S','W']}, lights:[{at:0,S:'red',W:'green'}],
  actors:[{id:'you',kind:'you',from:'S',waitText:'ROT'},{id:'amb',kind:'ambulance',path:'M-30 330 L-30 -330',stop:262,through:true,label:'Ambulance'},{id:'w',kind:'car',from:'W',label:'Car with green from the left'}],
  order:[['amb'],['w']],
  captions:['You wait at red. Behind you an ambulance with blue lights and siren wants to pass.','Everyone makes way. The car with green stops for it; you keep still unless you must move to open a path — then carefully, even over the stop line.','After the ambulance, normal rules resume: green continues.'],
  rule:'Blue light plus siren means: make way immediately. Slow down, pull to the side, stop if needed. At a red light you may cross the stop line carefully if that is the only way to let the vehicle through — never blindly into the crossing. Do not follow the ambulance through.',
  mistake:'Panicking into the crossing on red, or freezing in the middle of the lane with the ambulance behind you.',
  stvo:'§ 38 Abs. 1 StVO' },
{ id:'sp-rettungsgasse', ch:9, title:'Rettungsgasse: the emergency corridor', de:'Rettungsgasse',
  road:{type:'none'}, extras:['<rect x="-90" y="-330" width="180" height="660" fill="var(--asphalt)"/><path d="M-30 -330 V330 M30 -330 V330" stroke="var(--paint)" stroke-width="3" stroke-dasharray="14 10"/><path d="M-90 -330 V330 M90 -330 V330" stroke="var(--paint)" stroke-width="4"/>'],
  labels:[{x:-200,y:-280,text:'left lane → far left',size:15},{x:200,y:-280,text:'all other lanes → far right',size:15}],
  actors:[{id:'l1',kind:'car',path:'M-60 60 L-72 -30',stop:0,label:'Left lane'},{id:'l2',kind:'car',path:'M-60 180 L-72 90',stop:0,label:'Left lane'},{id:'m1',kind:'car',path:'M0 40 L14 -50',stop:0,label:'Middle lane'},{id:'m2',kind:'car',path:'M0 170 L14 80',stop:0,label:'Middle lane'},{id:'r1',kind:'car',path:'M60 100 L74 10',stop:0,label:'Right lane'},{id:'r2',kind:'car',path:'M60 230 L74 140',stop:0,label:'Right lane'},{id:'amb',kind:'ambulance',path:'M-30 400 L-30 -400',stop:0,delay:2.4,label:'Fire engine / ambulance',travel:3}],
  order:[['l1','l2','m1','m2','r1','r2'],['amb']],
  captions:['Traffic on the A100 slows to a crawl. Time to form the corridor — before anyone is coming.','Left lane moves as far left as possible; every other lane moves right. The gap opens between the left lane and the one next to it.','The emergency vehicle drives through the corridor. Keep it open until traffic flows again.'],
  rule:'As soon as traffic on a motorway or multi-lane road slows to a jam, form the Rettungsgasse: cars in the leftmost lane go far left, all other lanes go far right. The corridor is always between the left lane and the rest. Forming it late, or driving in it, costs a fine, points and a driving ban.',
  mistake:'Waiting until you hear a siren. By then it is too late to move.',
  berlin:'On the A100/A113 city motorway with two lanes: left lane left, right lane right — simple.',
  stvo:'§ 11 Abs. 2 StVO' },
{ id:'sp-police', ch:9, title:'A police officer overrides the lights', de:'Polizeibeamter regelt den Verkehr',
  road:{lights:['S','N','E','W'],stop:['S','N','E','W']}, lights:[{at:0,S:'red',N:'red',E:'green',W:'green'}], extras:[officer],
  actors:[{id:'you',kind:'you',from:'S'},{id:'e',kind:'car',from:'E',label:'Car from the east with green',waitText:'STOP'}],
  order:[['you']],
  captions:['An officer stands in the middle, arms stretched out sideways along your street. Your light shows red, the cross street green.','Hand signals beat lights and signs. The arms point along your direction — you may go. The cross-street cars face the officer\'s chest and back: that is their red light, despite the green.'],
  rule:'Police hand signals override lights and signs. Arms stretched out sideways: the officer\'s chest and back are a red light — traffic coming toward them from the front or the back stops; traffic in the direction the arms point may go. One arm raised: attention, the direction is about to change — stop unless you are already in the crossing. Waving forward: go.',
  mistake:'Obeying the green light while the officer is signalling stop.',
  stvo:'§ 36 StVO' },

// ===== Chapter 10: Berlin parking & local rules =====
{ id:'p-direction', ch:10, title:'Park in the direction of travel', de:'In Fahrtrichtung parken',
  road:{type:'straight'}, extras:[okmark(80,-110), xmark(-80,-110)], labels:[{x:80,y:-150,text:'right side, facing your way',size:13},{x:-80,y:-150,text:'against the traffic: fine',size:13}],
  actors:[{id:'you',kind:'you',path:'M26 330 L26 -62 Q26 -96 52 -104 L52 -110',stop:0,through:true,indicator:1,signalAlways:true,travel:4},{id:'a',kind:'car',static:true,x:52,y:-190,angle:0},{id:'b',kind:'car',static:true,x:52,y:-30,angle:0},{id:'w',kind:'car',static:true,x:-52,y:-110,angle:0,label:'Wrongly parked car'}],
  order:[['you']], duration:6,
  captions:['You look for a space on a two-way street.','Park only on the right side in your direction of travel. The car on the left is parked against the traffic — that is only allowed in one-way streets.'],
  rule:'On a two-way street you park on the right, facing the direction of travel. Parking on the left side (nose against oncoming traffic) is only allowed in one-way streets or where signs mark parking there.',
  mistake:'Crossing to a free spot on the other side and parking facing the wrong way — a small fine, and you have to pull out into oncoming traffic later.',
  berlin:'Look at how the other cars are parked; in Berlin one-way Kiez streets people park on both sides.',
  stvo:'§ 12 Abs. 4 StVO' },
{ id:'p-halteverbot', ch:10, title:'No stopping vs. no parking', de:'Absolutes und eingeschränktes Halteverbot',
  road:{type:'straight'}, signs:[{code:'283',x:86,y:-160,size:40},{code:'286',x:86,y:120,size:40}],
  labels:[{x:-150,y:-160,text:'Not even for 10 seconds',size:14},{x:-150,y:120,text:'Stop up to 3 min to load or drop off',size:14}],
  actors:[{id:'a',kind:'car',static:true,x:52,y:110,angle:0,hazard:true,label:'Car dropping someone off'},{id:'you',kind:'you',path:'M26 330 L26 -330',stop:0,through:true,travel:6}],
  order:[['you']], duration:6,
  captions:['Two red-and-blue signs. The one with the X: no stopping at all. The one with a single stripe: no parking, but stopping up to three minutes is fine.','Under the single stripe a car may stop briefly to drop someone off or unload. Under the X, not at all.'],
  rule:'Absolute no-stopping (X): not even briefly. Restricted no-stopping (one stripe): you may stop for up to 3 minutes to load, unload, or let someone in or out — but not wait longer or leave the car. Arrows on the sign show whether the zone starts, ends or continues here.',
  mistake:'Hazard lights do not make anything legal. "Just 2 minutes" under the X is still a fine and possibly a tow.',
  berlin:'Temporary no-stopping signs for house moves and film shoots appear on Berlin streets every week. They are valid 72 hours after being put up — read the date on the plate when you park.',
  stvo:'§ 12 StVO, Zeichen 283 und 286' },
{ id:'p-bewohner', ch:10, title:'Resident parking zones', de:'Parkraumbewirtschaftung',
  road:{type:'straight'}, signs:[{code:'314',x:86,y:120,size:40},{code:'bewohner',x:86,y:164,size:40}],
  labels:[{x:-140,y:120,text:'Parkzone: ticket or resident permit',size:14}],
  actors:[{id:'a',kind:'car',static:true,x:52,y:-60,angle:0},{id:'b',kind:'car',static:true,x:52,y:-140,angle:0},{id:'you',kind:'you',path:'M26 330 L26 60 Q26 10 52 -6 L52 20',stop:0,through:true,indicator:1,signalAlways:true,travel:4}],
  order:[['you']], duration:6,
  captions:['A parking sign with the plate "Bewohner mit Parkausweis frei". You are in a managed parking zone.','Without a resident permit for this zone you need a ticket from the machine (or an app) during the hours on the plate. With the permit you park free.'],
  rule:'In Berlin\'s managed zones (most of the inner city) you pay at the machine or by app during the posted hours unless you hold a resident permit for that exact zone. Some plates say residents only — then visitors cannot park there at all. Check the hours: many zones are free at night or on Sundays.',
  mistake:'Assuming your resident permit works in the next zone over. It is valid only in the zone number printed on it.',
  berlin:'Zones are numbered (e.g. Zone 44 in Steglitz-Zehlendorf). Lankwitz is still mostly free; Steglitz around Schloßstraße is managed. The Ordnungsamt checks daily.',
  stvo:'§ 13 StVO, § 45 Abs. 1b StVO' },
{ id:'p-5m', ch:10, title:'Where you may never park', de:'Parkverbote an Kreuzungen',
  road:{bike:['NS'],zebra:['W']}, extras:[xmark(-48,140), xmark(48,-115), xmark(-140,-48), okmark(48,190)],
  labels:[{x:-48,y:170,text:'< 5 m from the corner',size:12},{x:48,y:-145,text:'< 8 m: cycle path crosses',size:12},{x:-140,y:-80,text:'< 5 m before a zebra',size:12},{x:48,y:220,text:'5 m+ from the corner: fine',size:12}],
  actors:[{id:'a',kind:'car',static:true,x:-48,y:110,angle:180,label:'Too close to the corner'},{id:'b',kind:'car',static:true,x:48,y:-85,angle:0,label:'Blocks the view of the cycle path'},{id:'c',kind:'car',static:true,x:-110,y:-48,angle:270,label:'Before the zebra'},{id:'d',kind:'car',static:true,x:48,y:160,angle:0,label:'Correctly parked'}],
  order:[], duration:5,
  captions:['Around a crossing there are minimum distances: 5 m from the corner (where the kerbs meet), 8 m if a cycle path crosses, 5 m before a zebra crossing, and never on the cycle path or in front of a lowered kerb.'],
  rule:'No parking within 5 m of a corner (measured from where the kerb lines meet), within 8 m where a cycle path continues across the side street, within 5 m before a zebra crossing, on cycle paths and lanes, in front of driveways and lowered kerbs, and on pavements unless marked. Since 2020 these are fined harder and towed more often.',
  mistake:'"Half on the pavement, out of everyone\'s way" — that is a separate fine in Berlin.',
  berlin:'Berlin districts tow at crossings and on cycle lanes systematically. Corner distances are the most common ticket for newcomers.',
  stvo:'§ 12 Abs. 3 StVO' },
{ id:'p-umwelt', ch:10, title:'Umweltzone and 30 km/h main roads', de:'Umweltzone & Tempo 30',
  road:{type:'straight'}, signs:[{code:'270.1',x:86,y:200,size:42},{code:'274-30',x:86,y:60,size:40}], labels:[{x:-150,y:200,text:'inside the S-Bahn ring: green sticker',size:13},{x:-150,y:60,text:'often 22–6 h or near schools',size:13}],
  actors:[{id:'you',kind:'you',from:'S',stop:0,through:true,travel:6}], order:[['you']], duration:6,
  captions:['Two signs you meet on every drive into the city.','Inside the S-Bahn ring only cars with a green environmental sticker may drive (your BMW qualifies with the sticker in the windscreen). Many main roads are 30 km/h at night, near schools or permanently — read the plate under the sign.'],
  rule:'The Umweltzone covers everything inside the S-Bahn ring: you need a green Plakette stuck to the windscreen, otherwise it is a fine even if the car is clean. Speed on Berlin main roads is 50 unless signed; large stretches are 30, sometimes only at certain hours shown on the plate.',
  mistake:'Forgetting that a 30 sign without a "zone" frame only applies until the next crossing or the end sign — while a "ZONE 30" sign applies to the whole area.',

// ---- App: routing, views, player ----
const CHAPTERS = [
  { n:1, title:'Right before left', de:'Rechts vor Links', desc:'The default rule at every crossing without signs — and the cases where it silently switches off.' },
  { n:2, title:'Signs that set priority', de:'Vorfahrtszeichen', desc:'Triangle, stop, yellow diamond, the bending priority road and the plates under them.' },
  { n:3, title:'Turning', de:'Abbiegen', desc:'Unprotected left turns, opposing left-turners, right turns across cycle paths, pedestrians on the road you enter.' },
  { n:4, title:'Traffic lights', de:'Ampeln', desc:'Green does not mean empty. Arrow signals, the green arrow plate, flashing yellow and dead lights.' },
  { n:5, title:'Odd-shaped crossings', de:'Einmündungen & schräge Kreuzungen', desc:'T-junctions, diagonal streets, five arms, merging lanes and the zipper.' },
  { n:6, title:'Roundabouts', de:'Kreisverkehr', desc:'Who yields, when to signal, mini roundabouts and roundabouts without the sign.' },
  { n:7, title:'Trams and buses', de:'Straßenbahn & Bus', desc:'BVG has habits of its own: tram stops without islands, buses pulling out, hazard lights, bus lanes.' },
  { n:8, title:'Cyclists and pedestrians', de:'Radfahrer & Fußgänger', desc:'Bicycle streets, painted lanes, bike boxes, zebra crossings, living streets and the 1.5 m rule.' },
  { n:9, title:'Special cases', de:'Sonderfälle', desc:'Leaving a driveway, railway crossings, emergency vehicles, police hand signals, one-way streets.' },
  { n:10, title:'Berlin parking & local rules', de:'Parken in Berlin', desc:'Resident zones, no-stopping variants, parking direction, the Umweltzone, 30 km/h main roads.' },
];
const $ = (s,p)=> (p||document).querySelector(s);
const main = $('#main'), nav = $('#nav');
let player = null;

function route(){ const h = location.hash.replace('#','') || 'home'; const [k, v] = h.split('/');
  if(player){ player.stop(); player=null; }
  const fn = document.querySelector('.float-nav'); if(fn) fn.remove();
  if(k==='s') renderScene(v); else if(k==='ch') renderChapter(+v); else if(k==='signs') renderGlossary(); else renderHome();
  main.classList.remove('scene-enter'); void main.offsetWidth; main.classList.add('scene-enter');
  renderNav(k, v); window.scrollTo(0,0); }
window.addEventListener('hashchange', route);

function renderNav(k, v){
  const cur = k==='s' ? SCENES.find(s=>s.id===v) : null; const curCh = k==='ch' ? +v : cur ? cur.ch : null;
  nav.innerHTML = `<button data-h="home" ${k==='home'||k===''?'aria-current="true"':''}><span class="num">⌂</span>Start</button>
    <div class="eyebrow">Chapters</div>` +
    CHAPTERS.map(c=>`<button data-h="ch/${c.n}" ${curCh===c.n?'aria-current="true"':''}><span class="num">${c.n}</span><span>${c.title}</span><span class="cnt">${SCENES.filter(s=>s.ch===c.n).length}</span></button>`).join('') +
    `<div class="sep"></div><button data-h="signs" ${k==='signs'?'aria-current="true"':''}><span class="num">▲</span>Sign glossary</button>`;
  nav.querySelectorAll('button').forEach(b=> b.onclick=()=> location.hash = b.dataset.h);
}

function thumb(scene, t){ const svg = document.createElementNS(NS,'svg'); const v = new SceneView(svg, scene); v.quizHidden=true; v.setTime(t==null?T_ARRIVE+0.1:t); v.actors.forEach(a=>{ if(a.intent){ a.intent.setAttribute('opacity',.7); a.intentHead.setAttribute('opacity',.7);} }); return svg; }

function renderHome(){
  main.innerHTML = `<div class="hero"><div>
      <div class="crumb">Berlin · driving guide for the family</div>
      <h2>Who goes first at a Berlin crossing?</h2>
      <p>${SCENES.length} animated situations from the streets of Berlin. Your car is always the <b style="color:var(--accent)">blue one</b>. Press play, watch who waits and who goes, then try quiz mode and guess before the answer appears.</p>
      <p>Rules follow the German StVO as of 2026; the Berlin notes cover what is typical here — trams in the east, bicycle streets, 30 km/h main roads, parking zones.</p>
      <p><button class="controls-inline" id="startBtn" style="background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:600;margin-top:6px">Start with chapter 1 →</button></p>
    </div><div class="stage" id="heroStage"></div></div>
    <div class="card" style="margin-bottom:22px"><h3>How to read the scenes</h3><div class="legend">
      <div><i style="background:${COL.you}"></i>You</div><div><i style="background:${COL.cars[0]}"></i>Other cars</div><div><i style="background:${COL.bvg}"></i>Tram / BVG bus</div><div><i style="background:${COL.bike};border-radius:50%;height:14px"></i>Cyclist</div><div><i style="background:${COL.ped};border-radius:50%;height:14px;border:2px solid #444"></i>Pedestrian</div>
      <div><i class="badge" style="background:var(--wait)">WARTEN</i>Must wait</div><div><i class="badge" style="background:var(--go)">1</i>Goes first</div><div><i style="width:22px;height:0;border-top:3px dashed ${COL.cars[3]}"></i>Intended path</div>
    </div></div>
    <div class="section-title">Chapters</div>
    <div class="chapters">${CHAPTERS.map(c=>`<button data-h="ch/${c.n}"><span class="num">CHAPTER ${c.n}</span><span class="t">${c.title}</span><span class="d">${c.desc}</span><span class="c">${SCENES.filter(s=>s.ch===c.n).length} scenes</span></button>`).join('')}</div>`;
  main.querySelectorAll('[data-h]').forEach(b=> b.onclick=()=> location.hash=b.dataset.h);
  $('#startBtn').onclick = ()=> location.hash = 's/'+SCENES.find(s=>s.ch===1).id;
  const demo = SCENES.find(s=>s.id==='rvl-3') || SCENES[0];
  const svg = document.createElementNS(NS,'svg'); $('#heroStage').appendChild(svg);
  player = new Player(new SceneView(svg, demo), null); player.loop = true; player.play();
}

function renderChapter(n){
  const c = CHAPTERS.find(x=>x.n===n); const list = SCENES.filter(s=>s.ch===n);
  main.innerHTML = `<div class="crumb">Chapter ${n} · <i>${c.de}</i></div><div class="scene-head"><h2>${c.title}</h2><p class="de">${c.desc}</p></div>
    <div class="scenelist" style="margin-top:18px">${list.map(s=>`<button data-id="${s.id}"><div class="th"></div><div class="t">${s.title}<span class="de">${s.de||''}</span></div></button>`).join('')}</div>`;
  main.querySelectorAll('[data-id]').forEach((b,i)=>{ b.querySelector('.th').appendChild(thumb(list[i])); b.onclick=()=> location.hash='s/'+b.dataset.id; });
}

function renderGlossary(){
  main.innerHTML = `<div class="crumb">Reference</div><div class="scene-head"><h2>Sign glossary</h2><p class="de">Every sign used in the scenes, with its official number. Tap "used in" to jump to a situation.</p></div>
    <div class="gloss" style="margin-top:18px">${Object.keys(SIGNS).map(code=>{ const s=SIGNS[code]; const used = SCENES.filter(sc=>(sc.signs||[]).some(x=>x.code===code));
      return `<div class="g">${signSVG(code,56)}<div><b>${s.name}</b><span class="code">${/^\d/.test(code)?'Zeichen '+code:''}</span><p><b style="color:var(--ink)">${s.en}.</b> ${s.desc}</p>${used.length?`<p>Used in: ${used.slice(0,3).map(u=>`<a href="#s/${u.id}">${u.title}</a>`).join(' · ')}</p>`:''}</div></div>`; }).join('')}</div>`;
}

const BASE_RATE = 0.7; // global playback pace (1 = real-time of the scene timeline)
const ICON = { play:'<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>', pause:'<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>', step:'<svg viewBox="0 0 16 16"><path d="M3 2l8 6-8 6zM12 2h2v12h-2z"/></svg>', replay:'<svg viewBox="0 0 16 16"><path d="M8 3a5 5 0 1 1-4.5 2.8l1.8.9A3 3 0 1 0 8 5v2L4 4l4-3z"/></svg>' };

function renderScene(id){
  const idx = SCENES.findIndex(s=>s.id===id); if(idx<0){ location.hash='home'; return; }
  const s = SCENES[idx], c = CHAPTERS.find(x=>x.n===s.ch); const prev = SCENES[idx-1], next = SCENES[idx+1];
  const chIdx = SCENES.filter(x=>x.ch===s.ch).findIndex(x=>x.id===id)+1, chCount = SCENES.filter(x=>x.ch===s.ch).length;
  try{ localStorage.setItem('bk-last', id); }catch(e){}
  main.innerHTML = `<div class="topbar"><div class="crumb">Chapter ${s.ch} · <b>${c.title}</b></div><div class="progress">scene ${chIdx} / ${chCount} · ${idx+1} of ${SCENES.length}</div></div>
    <div class="scene-head"><h2>${s.title}</h2><p class="de">${s.de||''}</p></div>
    <div class="grid">
      <div>
        <div class="stage"><svg id="stage"></svg>
          <div class="timeline" id="tl"><i></i></div>
          <div class="caption" id="cap"></div>
          <div class="quiz hidden" id="quiz"></div>
          <div class="controls">
            <button class="primary" id="btnPlay">${ICON.play} Play</button>
            <button id="btnStep" title="Jump to the next moment">${ICON.step} Step</button>
            <button id="btnReplay">${ICON.replay} Replay</button>
            <button id="btnSpeed" title="Slow motion">½×</button>
            <span class="spacer"></span>
            <button id="btnQuiz" title="Hide the answer and guess first">Quiz mode</button>
          </div>
        </div>
      </div>
      <div class="explain">
        <div class="card rule"><h3>The rule</h3>${s.rule.split('\n').map(p=>`<p>${p}</p>`).join('')}${s.stvo?`<span class="stvo">${s.stvo}</span>`:''}</div>
        ${s.mistake?`<div class="card mistake"><h3>Common mistake</h3><p>${s.mistake}</p></div>`:''}
        ${s.berlin?`<div class="card berlin"><h3>Berlin note</h3><p>${s.berlin}</p></div>`:''}
        ${(s.signs&&s.signs.length)?`<div class="card"><h3>Signs in this scene</h3><div class="signs">${[...new Set(s.signs.map(x=>x.code))].map(code=>`<div class="s">${signSVG(code,38)}<div><b>${SIGNS[code].name}</b><span>${SIGNS[code].en}</span></div></div>`).join('')}</div></div>`:''}
      </div>
    </div>
    <div class="pager">${prev?`<button id="prevBtn"><small>← Previous</small><span>${prev.title}</span></button>`:'<span></span>'}${next?`<button id="nextBtn" class="next"><small>Next →</small><span>${next.title}</span></button>`:''}</div>`;
  if(prev) $('#prevBtn').onclick=()=> location.hash='s/'+prev.id; if(next) $('#nextBtn').onclick=()=> location.hash='s/'+next.id;
  // floating desktop nav
  const fn = document.createElement('div'); fn.className='float-nav';
  if(prev){ const b=document.createElement('button'); b.className='fn-prev'; b.textContent='← '+prev.title.slice(0,28); b.onclick=()=>location.hash='s/'+prev.id; fn.appendChild(b); }
  if(next){ const b=document.createElement('button'); b.className='fn-next'; b.textContent=next.title.slice(0,28)+' →'; b.onclick=()=>location.hash='s/'+next.id; fn.appendChild(b); }
  document.body.appendChild(fn);
  const view = new SceneView($('#stage'), s);
  player = new Player(view, { tl:$('#tl'), cap:$('#cap'), quiz:$('#quiz'), play:$('#btnPlay'), step:$('#btnStep'), replay:$('#btnReplay'), speed:$('#btnSpeed'), quizBtn:$('#btnQuiz') });
  try{ if(localStorage.getItem('bk-quiz')==='1') player.setQuiz(true); }catch(e){}
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce) player.play();
}

class Player {
  constructor(view, ui){ this.view=view; this.ui=ui; this.speed=1; this.playing=false; this.loop=false; this.quiz=false; this.quizAsked=false; this.t=0; this.last=null; this._capIdx=-1; this.render(0);
    if(ui){ ui.play.onclick=()=> this.playing? this.pause(): this.play(); ui.step.onclick=()=> this.step(); ui.replay.onclick=()=> this.replay(); ui.speed.onclick=()=> this.toggleSpeed(); ui.quizBtn.onclick=()=> this.setQuiz(!this.quiz);
      const kf = view.keyframes; ui.tl.innerHTML='<i></i>'+kf.map(k=>`<b style="left:${(k/view.duration*100).toFixed(1)}%"></b>`).join('');
      ui.tl.onclick=(e)=>{ const r=ui.tl.getBoundingClientRect(); this.t = (e.clientX-r.left)/r.width*view.duration; this.render(this.t); }; }
  }
  play(){ if(this.t>=this.view.duration-0.01) this.t=0; this.playing=true; this.last=null; if(this.ui) this.ui.play.innerHTML=ICON.pause+' Pause'; this.raf=requestAnimationFrame(ts=>this.tick(ts)); }
  pause(){ this.playing=false; cancelAnimationFrame(this.raf); if(this.ui) this.ui.play.innerHTML=ICON.play+' Play'; }
  stop(){ this.pause(); }
  replay(){ this.t=0; this.quizAsked=false; this._capIdx=-1; if(this.quiz){ this.view.quizHidden=true; this.ui.quiz.classList.add('hidden'); } this.render(0); this.play(); }
  step(){ const kf=this.view.keyframes; const nxt = kf.find(k=>k>this.t+0.05); this.pause(); this.t = nxt!=null? nxt : this.view.duration; this.render(this.t); }
  toggleSpeed(){ this.speed = this.speed===1? .5 : 1; this.ui.speed.classList.toggle('on', this.speed!==1); }
  setQuiz(on){ this.quiz=on; try{ localStorage.setItem('bk-quiz', on?'1':'0'); }catch(e){} this.ui.quizBtn.classList.toggle('on',on); this.replay(); if(!on){ this.view.quizHidden=false; this.ui.quiz.classList.add('hidden'); this.render(this.t);} }
  tick(ts){ if(!this.playing) return; if(this.last==null) this.last=ts; const dt=(ts-this.last)/1000*this.speed*BASE_RATE; this.last=ts; this.t+=dt;
    if(this.quiz && !this.quizAsked && this.t>=T_ARRIVE+0.3){ this.t=T_ARRIVE+0.3; this.render(this.t); this.askQuiz(); return; }
    if(this.t>=this.view.duration){ this.t=this.view.duration; this.render(this.t); if(this.loop){ this.t=0; } else { this.pause(); return; } }
    this.render(this.t); this.raf=requestAnimationFrame(ts2=>this.tick(ts2)); }
  render(t){ const v=this.view; v.setTime(t); if(!this.ui) return; this.ui.tl.firstChild.style.width=(t/v.duration*100)+'%';
    const caps = v.scene.captions||[]; let ci=0; for(let i=1;i<caps.length;i++){ if(v.capTimes[i]!=null && t>=v.capTimes[i]) ci=i; }
    if(this.quiz && v.quizHidden && ci>0) ci=0;
    const text = caps[ci]||'';
    if(ci !== this._capIdx){ this._capIdx=ci; const cap=this.ui.cap; cap.classList.remove('cap-enter'); const inner=text?'<span class="stepno">'+(ci===0?'start':'step '+ci)+'</span><span>'+text+'</span>':''; cap.textContent=''; if(inner){ cap.insertAdjacentHTML('beforeend',inner); void cap.offsetWidth; cap.classList.add('cap-enter'); } }
  }
  askQuiz(){ this.pause(); this.quizAsked=true; const v=this.view, s=v.scene; const q = s.quiz||{}; const ans = q.answer || (s.order&&s.order[0]) || [];
    const opts = (q.options || v.actors.filter(a=>!a.static && a.def.kind!=='ped').map(a=>a.id));
    this.ui.quiz.classList.remove('hidden');
    this.ui.quiz.innerHTML = `<p>${q.q||'Who goes first?'}</p><div class="opts">${opts.map(id=>{ const a=v.actors.find(x=>x.id===id); return `<button data-id="${id}"><span class="dot" style="background:${a?a.color:'#999'}"></span>${a&&a.def.label?a.def.label:id==='you'?'You (blue)':id}</button>`; }).join('')}</div><div class="fb"></div>`;
    this.ui.quiz.querySelectorAll('button').forEach(b=> b.onclick=()=>{ const ok = ans.length===0 || ans.includes(b.dataset.id); const fb=this.ui.quiz.querySelector('.fb'); fb.className='fb '+(ok?'ok':'no'); fb.textContent = ok? '✓ Correct. ' + (q.why||'Watch the animation to see the full order.') : '✗ Not quite. ' + (q.why||'Watch who actually goes first.'); v.quizHidden=false; this.ui.quiz.querySelectorAll('button').forEach(x=>x.disabled=true); setTimeout(()=>this.play(), 900); }); }
}

// boot
route();

</script>
