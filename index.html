<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Animated guide to Berlin driving rules: who goes first at crossings, signs, turning, trams, cyclists.">
<title>Berlin Kreuzung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#E9EBE6; --line:#D3D6CF;
  --ink:#1B1F26; --muted:#5C6470; --faint:#8A919B;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --accent-soft:#DCE6F7;
  --bvg:#F2D53C; --go:#2A9D5C; --go-soft:#DDF1E5; --wait:#D23B3B; --wait-soft:#F8DEDE; --warn:#C9860B; --warn-soft:#F7EBD1;
  --asphalt:#45484E; --asphalt-2:#3B3E44; --paint:#ECE9DC; --kerb:#B9BDB3; --ground:#CFD3C8; --grass:#B8C9AA;
  --shadow:0 1px 2px rgba(20,24,30,.08),0 8px 24px rgba(20,24,30,.08);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171B; --surface:#1E2126; --surface-2:#262A30; --line:#343940;
    --ink:#E8EAE6; --muted:#A5ACB6; --faint:#737A85;
    --accent:#6D9BE8; --accent-ink:#0F1621; --accent-soft:#233450;
    --go:#4DBF7E; --go-soft:#1E3A2B; --wait:#E5605E; --wait-soft:#43262A; --warn:#E0A63A; --warn-soft:#3E3320;
    --asphalt:#3A3D43; --asphalt-2:#30333A; --paint:#DCD8C8; --kerb:#5B6068; --ground:#2A2E33; --grass:#2F3A2C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1E2126; --surface-2:#262A30; --line:#343940;
  --ink:#E8EAE6; --muted:#A5ACB6; --faint:#737A85;
  --accent:#6D9BE8; --accent-ink:#0F1621; --accent-soft:#233450;
  --go:#4DBF7E; --go-soft:#1E3A2B; --wait:#E5605E; --wait-soft:#43262A; --warn:#E0A63A; --warn-soft:#3E3320;
  --asphalt:#3A3D43; --asphalt-2:#30333A; --paint:#DCD8C8; --kerb:#5B6068; --ground:#2A2E33; --grass:#2F3A2C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 28px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .mark{width:34px;height:34px;flex:none}
.brand h1{font:700 22px/1 var(--display);margin:0;letter-spacing:.01em}
.brand small{display:block;font:400 12px/1.2 var(--body);color:var(--muted);margin-top:3px}
.rail nav button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 8px;border-radius:6px;text-align:left;font-size:14px;color:var(--ink)}
.rail nav button:hover{background:var(--surface-2)}
.rail nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.rail nav .num{font:500 11px var(--mono);color:var(--faint);width:18px;flex:none}
.rail nav .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}
.rail .sep{height:1px;background:var(--line);margin:10px 6px}
.rail .eyebrow{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 8px 4px}
/* main */
.main{padding:28px 36px 60px;max-width:1180px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.crumb{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crumb b{color:var(--accent)}
.progress{font:500 12px var(--mono);color:var(--faint)}
.scene-head h2{font:700 clamp(28px,3.4vw,40px)/1.05 var(--display);margin:0;text-wrap:balance}
.scene-head .de{font:italic 400 17px var(--body);color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:24px;margin-top:18px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.stage > svg{display:block;width:100%;height:auto;background:var(--ground)}
.controls{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.controls button{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink)}
.controls button:hover{background:var(--surface-2)}
.controls button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.controls button.primary:hover{filter:brightness(1.08)}
.controls button.on{background:var(--accent-soft);border-color:var(--accent)}
.controls .spacer{flex:1}
.controls svg{width:14px;height:14px;fill:currentColor}
.timeline{height:4px;background:var(--surface-2);position:relative}
.timeline i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0}
.timeline b{position:absolute;top:-2px;width:2px;height:8px;background:var(--faint);margin-left:-1px}
.caption{padding:12px 14px;min-height:60px;font-size:14px;line-height:1.5;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.caption .stepno{flex:none;font:600 10px var(--mono);letter-spacing:.06em;color:var(--faint);text-transform:uppercase;padding-top:3px;min-width:36px}
.quiz{padding:12px 14px;border-top:1px solid var(--line);background:var(--warn-soft)}
.quiz p{margin:0 0 8px;font-weight:600}
.quiz .opts{display:flex;flex-wrap:wrap;gap:6px}
.quiz .opts button{padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.quiz .opts button .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.quiz .fb{margin-top:8px;font-size:14px}
.quiz .fb.ok{color:var(--go)} .quiz .fb.no{color:var(--wait)}
/* explain */
.explain{display:flex;flex-direction:column;gap:0}
.card{background:none;border:none;border-top:1px solid var(--line);border-radius:0;padding:18px 0}
.card:first-child{border-top:none;padding-top:0}
.card h3{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.card p{margin:0;font-size:15px;max-width:62ch;line-height:1.6}
.card p+p{margin-top:8px}
.card.rule h3{color:var(--go)}
.card.mistake h3{color:var(--wait)}
.card.berlin h3{color:var(--warn)}
.card .stvo{display:inline-block;margin-top:12px;font:500 11px var(--mono);color:var(--faint);border:1px solid var(--line);padding:2px 8px;border-radius:2px;letter-spacing:.04em}
.signs{display:flex;flex-wrap:wrap;gap:10px}
.signs .s{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:8px;padding:6px 10px 6px 6px;font-size:13px}
.signs .s svg{width:38px;height:38px;flex:none}
.signs .s b{display:block;font-weight:600}
.signs .s span{color:var(--muted);font-size:12px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:14px;height:22px;border-radius:3px;flex:none}
.legend .badge{width:auto;height:auto;font:600 10px var(--body);padding:2px 6px;border-radius:999px;letter-spacing:.06em;color:#fff;font-style:normal}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.pager button{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:46%;text-align:left}
.pager button:hover{background:var(--surface-2)}
.pager button.next{text-align:right;margin-left:auto}
.pager small{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager span{font:700 18px/1.1 var(--display)}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center;margin-bottom:26px}
.hero h2{font:700 clamp(36px,5vw,56px)/1 var(--display);margin:0 0 10px;text-wrap:balance}
.hero p{font-size:17px;color:var(--muted);max-width:58ch;margin:0 0 8px}
.hero .stage{margin:0}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chapters button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.chapters button:hover{border-color:var(--accent)}
.chapters .num{font:500 11px var(--mono);color:var(--faint)}
.chapters .t{font:700 20px/1.1 var(--display)}
.chapters .d{font-size:13px;color:var(--muted)}
.chapters .c{font:500 11px var(--mono);color:var(--accent);margin-top:4px}
.section-title{font:700 24px/1.1 var(--display);margin:30px 0 10px}
/* glossary */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.gloss .g{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gloss .g svg{width:56px;height:56px;flex:none}
.gloss .g b{display:block;font-weight:600}
.gloss .g .code{font:500 11px var(--mono);color:var(--faint)}
.gloss .g p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.gloss .g a{font-size:12px}
/* scene list in chapter view */
.scenelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.scenelist button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.scenelist button:hover{border-color:var(--accent)}
.scenelist .th > svg{width:100%;height:auto;background:var(--ground);display:block}
.scenelist .t{padding:8px 12px 10px;font:700 17px/1.15 var(--display)}
.scenelist .de{font:italic 400 12px var(--body);color:var(--muted);display:block;margin-top:2px}
.hidden{display:none!important}
.menu-btn{display:none}
/* floating next/prev — desktop only */
.float-nav{display:none}
@media (min-width:901px){
  .float-nav{position:fixed;bottom:24px;right:28px;display:flex;gap:8px;z-index:50}
  .float-nav button{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--body);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .float-nav button:hover{background:var(--surface-2)}
  .float-nav button.fn-next{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .float-nav button.fn-next:hover{filter:brightness(1.08)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px}
  .rail nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .rail nav button{width:auto;white-space:nowrap;padding:6px 10px}
  .rail nav .cnt,.rail .sep,.rail .eyebrow{display:none}
  .main{padding:18px 16px 50px}
  .grid,.hero{grid-template-columns:1fr}
}
@keyframes capEnter { from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:translateY(0); } }
.caption.cap-enter { animation: capEnter .3s ease-out both; }
@keyframes mainFade { from{ opacity:0; transform:translateY(5px); } to{ opacity:1; transform:translateY(0); } }
.main.scene-enter { animation: mainFade .22s ease-out both; }
@media (max-width:900px){
  .controls{flex-wrap:wrap;gap:6px}
  .controls button{padding:7px 10px;font-size:12px}
  .stage > svg{max-height:280px}
}
@media (prefers-reduced-motion: reduce){
  .stage *{transition:none!important}
  .caption.cap-enter,.main.scene-enter{animation:none}
}
</style>
<style>img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="2" y="2" width="36" height="36" rx="6" fill="#F2D53C"/><rect x="9" y="9" width="22" height="22" fill="#fff"/><rect x="13" y="13" width="14" height="14" fill="#F2D53C"/></svg>
      <div><h1>Berlin Kreuzung</h1><small>Who goes first, and why</small></div>
      <a href="bike.html" style="display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:4px 10px;border-radius:99px;background:var(--go-soft);color:var(--go);font:600 12px var(--body);text-decoration:none;white-space:nowrap">🚲 Bike guide →</a>
    </div>
    <nav id="nav" aria-label="Chapters"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
// ---- Traffic sign library (simplified vector versions of German StVO signs) ----
const SIGN_RED = '#C8102E', SIGN_BLUE = '#0F4C9A', SIGN_WHITE = '#FFFFFF', SIGN_BLACK = '#111111', SIGN_YELLOW = '#F5C400', SIGN_GREEN = '#1E9E4A';
function triDown(fill, stroke){ return `<path d="M6 12 H94 L50 90 Z" fill="${fill}" stroke="${stroke}" stroke-width="10" stroke-linejoin="round"/>`; }
function triUp(inner){ return `<path d="M50 10 L94 88 H6 Z" fill="${SIGN_WHITE}" stroke="${SIGN_RED}" stroke-width="10" stroke-linejoin="round"/>${inner||''}`; }
function circleBlue(inner){ return `<circle cx="50" cy="50" r="46" fill="${SIGN_BLUE}" stroke="${SIGN_WHITE}" stroke-width="4"/>${inner||''}`; }
function circleRed(inner){ return `<circle cx="50" cy="50" r="46" fill="${SIGN_WHITE}" stroke="${SIGN_RED}" stroke-width="10"/>${inner||''}`; }
function rectBlue(inner){ return `<rect x="4" y="4" width="92" height="92" rx="6" fill="${SIGN_BLUE}" stroke="${SIGN_WHITE}" stroke-width="3"/>${inner||''}`; }
function plate(inner){ return `<rect x="4" y="4" width="92" height="92" rx="5" fill="${SIGN_WHITE}" stroke="${SIGN_BLACK}" stroke-width="3"/>${inner||''}`; }
function arrowUp(x,y,s,fill){ return `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -22 L12 -6 H5 V22 H-5 V-6 H-12 Z" fill="${fill}"/>`; }
function bikeIcon(fill){ return `<g fill="none" stroke="${fill}" stroke-width="5" stroke-linecap="round"><circle cx="30" cy="62" r="14"/><circle cx="70" cy="62" r="14"/><path d="M30 62 L45 36 H62 L70 62 M45 36 L52 62 M40 36 H52"/></g>`; }
function pedIcon(x,y,s,fill){ return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}"><circle cx="0" cy="-22" r="6"/><path d="M-4 -14 H4 L8 4 L4 4 L4 22 H-1 L-1 6 L-4 22 H-9 L-6 4 L-8 -2 Z"/></g>`; }
function carIcon(x,y,s,fill){ return `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}"><path d="M-22 6 L-16 -8 L-6 -14 H8 L18 -8 L22 6 V12 H-22 Z"/><circle cx="-12" cy="12" r="5"/><circle cx="12" cy="12" r="5"/></g>`; }
function bentLine(from, to){ // priority-plate line, 'from'/'to' in S,N,E,W ; thick black line
  const P = {S:[50,92],N:[50,8],E:[92,50],W:[8,50]};
  const a=P[from], b=P[to];
  return `<path d="M${a[0]} ${a[1]} L50 50 L${b[0]} ${b[1]}" fill="none" stroke="${SIGN_BLACK}" stroke-width="12" stroke-linejoin="round"/>`;
}
function thinArms(list){ return list.map(d=>{const P={S:[50,92],N:[50,8],E:[92,50],W:[8,50]};const a=P[d];return `<path d="M50 50 L${a[0]} ${a[1]}" stroke="${SIGN_BLACK}" stroke-width="4"/>`;}).join(''); }

const SIGNS = {
  '205': { name:'Vorfahrt gewähren', en:'Give way', desc:'Upside-down triangle. Others go first — you may roll on without stopping if the road is clear.', svg: () => triDown(SIGN_WHITE, SIGN_RED) },
  '206': { name:'Stop', en:'Stop and give way', desc:'Come to a full stop at the line (or where you can see), then go only when clear. A "rolling stop" is a fine.', svg: () => `<path d="M30 4 H70 L96 30 V70 L70 96 H30 L4 70 V30 Z" fill="${SIGN_RED}" stroke="${SIGN_WHITE}" stroke-width="4"/><text x="50" y="60" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#fff">STOP</text>` },
  '301': { name:'Vorfahrt', en:'Priority at the next intersection only', desc:'You go first at the next crossing. After that, right-before-left is back unless another sign says otherwise.', svg: () => triUp() },
  '306': { name:'Vorfahrtstraße', en:'Priority road', desc:'Yellow diamond: you have priority at every crossing until sign 307 ends it. Side streets must give way to you.', svg: () => `<path d="M50 4 L96 50 L50 96 L4 50 Z" fill="${SIGN_WHITE}"/><path d="M50 16 L84 50 L50 84 L16 50 Z" fill="${SIGN_YELLOW}"/>` },
  '307': { name:'Ende der Vorfahrtstraße', en:'End of priority road', desc:'Priority road ends here. From the next crossing, right-before-left applies again unless signed.', svg: () => `<path d="M50 4 L96 50 L50 96 L4 50 Z" fill="${SIGN_WHITE}"/><path d="M50 16 L84 50 L50 84 L16 50 Z" fill="${SIGN_YELLOW}"/><path d="M20 80 L80 20 M28 88 L88 28 M12 72 L72 12" stroke="${SIGN_BLACK}" stroke-width="4"/>` },
  '102': { name:'Kreuzung mit Vorfahrt von rechts', en:'Crossing ahead — right before left', desc:'Warning: at the next crossing, whoever comes from the right goes first. Slow down and look right.', svg: () => triUp(`<path d="M50 34 V78 M30 56 H70" stroke="${SIGN_BLACK}" stroke-width="9"/>`) },
  '1002-10': { name:'Abknickende Vorfahrt (von unten nach rechts)', en:'Priority road bends right', desc:'The thick line shows where the priority road goes. If you follow the bend, you keep priority — but you must signal.', svg: () => plate(thinArms(['N']) + bentLine('S','E')) },
  '1002-20': { name:'Abknickende Vorfahrt (von unten nach links)', en:'Priority road bends left', desc:'The thick line shows where the priority road goes. Follow the bend with your indicator on; you keep priority.', svg: () => plate(thinArms(['N']) + bentLine('S','W')) },
  '1002-11': { name:'Abknickende Vorfahrt (Seitenstraße)', en:'Priority road bends, seen from the side street', desc:'You are on the thin line. The priority road runs across and bends — everything on the thick line goes before you.', svg: () => plate(thinArms(['S']) + bentLine('W','N')) },
  '215': { name:'Kreisverkehr', en:'Roundabout', desc:'Together with the give-way triangle: cars already in the roundabout go first. No indicator when entering, indicator when leaving.', svg: () => circleBlue(`<g fill="none" stroke="#fff" stroke-width="7"><path d="M50 22 A28 28 0 1 0 74 36"/><path d="M50 22 A28 28 0 0 0 26 36" /></g><path d="M70 22 L80 40 L60 40 Z" fill="#fff"/><path d="M22 60 L20 40 L36 52 Z" fill="#fff"/><path d="M52 82 L70 72 L66 88 Z" fill="#fff"/>`) },
  '220': { name:'Einbahnstraße', en:'One-way street', desc:'Traffic only flows in the arrow direction. Priority rules do not change — right-before-left still applies at unsigned crossings.', svg: () => `<rect x="2" y="26" width="96" height="48" fill="${SIGN_BLUE}" stroke="#fff" stroke-width="3"/><path d="M14 50 H70 L58 36 M70 50 L58 64" fill="none" stroke="#fff" stroke-width="8"/><text x="50" y="72" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#fff">Einbahnstraße</text>` },
  '209': { name:'Vorgeschriebene Fahrtrichtung rechts', en:'You must turn right', desc:'Blue circle with an arrow: the only allowed direction. Common at the end of one-way streets and side roads onto main roads.', svg: () => circleBlue(`<path d="M28 50 H66 L54 36 M66 50 L54 64" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`) },
  '209-10': { name:'Vorgeschriebene Fahrtrichtung geradeaus', en:'Straight ahead only', desc:'No turning at this crossing.', svg: () => circleBlue(arrowUp(50,50,1.4,'#fff')) },
  '720': { name:'Grünpfeil', en:'Green arrow plate', desc:'Small green arrow next to the red light: you may turn right on red — but only after a full stop, and only if nobody (especially cyclists and pedestrians) is hindered.', svg: () => `<rect x="4" y="4" width="92" height="92" fill="${SIGN_BLACK}"/><path d="M22 50 H66 L52 32 M66 50 L52 68" fill="none" stroke="${SIGN_GREEN}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>` },

function signSVG(code, size, extraClass){

const NS = 'http://www.w3.org/2000/svg';

const T_ARRIVE = 1.4, T_FIRST = 2.0, T_GAP = 1.9;

const ROT = { S:0, W:90, N:180, E:270 };

function rotPt(x,y,deg){ const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a); return [Math.round((x*c - y*s)*100)/100, Math.round((x*s + y*c)*100)/100]; }

    const out=[k]; for(let i=1;i<c.length;i+=2){ const [x,y]=rotPt(c[i],c[i+1],deg); out.push(x,y); } return out;
  });
}
function pathStr(cmds){ return cmds.map(c=>c[0]+c.slice(1).join(' ')).join(' '); }

// Base paths: vehicle coming FROM the south (bottom), driving up in the right-hand lane (x=+30).
const BASE = {

  right:    { cmds:[['M',30,330],['L',30,72],['Q',30,30,72,30],['L',330,30]], stop:258 },
  left:     { cmds:[['M',30,330],['L',30,72],['C',30,18,-36,8,-72,-30],['L',-330,-30]], stop:258 },
  leftwide: { cmds:[['M',30,330],['L',30,72],['C',30,-10,10,-30,-72,-30],['L',-330,-30]], stop:258 },
  uturn:    { cmds:[['M',30,330],['L',30,72],['C',30,-10,-30,-10,-30,72],['L',-30,330]], stop:258 },
  bike:     { cmds:[['M',82,330],['L',82,-330]], stop:262 },

  ped:      { cmds:[['M',100,132],['L',100,-132]], stop:30 },   // crosses the EAST arm, walking north, on the near side
  pedfar:   { cmds:[['M',-100,132],['L',-100,-132]], stop:30 }, // crosses the WEST arm

function actorPath(a){

function ease(x){ x=Math.max(0,Math.min(1,x)); return x<.5? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }
function easeOut(x){ x=Math.max(0,Math.min(1,x)); return 1-Math.pow(1-x,3); }
function easeIn(x){ x=Math.max(0,Math.min(1,x)); return x*x; }

  (road.extra||[]).forEach(x=>{ const eg=el('g',{transform:`rotate(${x.angle})`},asp); armRect('S',120,360,eg,asphalt); const p=el('path',{d:'M0 66 V330',stroke:paint,'stroke-width':3,'stroke-dasharray':'14 10',fill:'none'},eg); });

function computeLightPhases(scene, goTs){
  if(!scene.road || !scene.road.lights || !scene.road.lights.length) return null;
  const dirs = scene.road.lights;
  const kf = [{ at:-1 }]; dirs.forEach(d=>{ kf[0][d]='red'; });
  (scene.order||[]).forEach((grp,i)=>{
    const fromDirs = new Set();
    grp.forEach(id=>{ const a=(scene.actors||[]).find(x=>x.id===id); if(a && a.from) fromDirs.add(a.from); });
    const ns = fromDirs.has('S')||fromDirs.has('N');
    const ew = fromDirs.has('E')||fromDirs.has('W');
    const phase = { at:(goTs[i]||2)-0.4 };
    dirs.forEach(d=>{ phase[d] = (ns&&(d==='S'||d==='N'))||(ew&&(d==='E'||d==='W')) ? 'green' : 'red'; });
    kf.push(phase);

}

  stvo:'§ 8 Abs. 1 StVO' },
{ id:'rvl-3', ch:1, title:'Three cars, three directions', de:'Drei Fahrzeuge – wer zuerst?',
  road:{}, actors:[{id:'you',kind:'you',from:'S'},{id:'a',kind:'car',from:'E',label:'Car from the right'},{id:'b',kind:'car',from:'W',label:'Car from the left'}],
  order:[['a'],['you'],['b']],
  captions:['Three cars arrive together. Everyone looks right.','The car from the east has nobody on its right (the north is empty) — it goes first.','Now your right side is clear, so you go.','The car from the west had you on its right and waited. It goes last.'],
  rule:'Work through the chain: find the car with nobody on its right. That one goes first. Then the car to its left is free, and so on. It sounds complicated but takes one glance: "Is my right empty? Then I go."',
  mistake:'Everybody waiting for everybody — and then two cars start at the same time. If you have the empty right side, go decisively.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'rvl-4', ch:1, title:'Four cars — the deadlock', de:'Die Patt-Situation',
  road:{}, actors:[{id:'you',kind:'you',from:'S'},{id:'e',kind:'car',from:'E',label:'Car from the east'},{id:'n',kind:'car',from:'N',label:'Car from the north'},{id:'w',kind:'car',from:'W',label:'Car from the west'}],
  order:[['you'],['e'],['n'],['w']],
  captions:['Four cars, four directions. Every car has someone on its right — the rule gives no answer.','Someone has to waive. Here the driver on your right gestures "you go" — so you go first.','Now the east car has an empty right side and goes.','Then north, then west. Eye contact and a small hand signal solve it.'],
  rule:'If all four arms are occupied, nobody has priority by the rule. One driver must clearly give up their turn — a hand gesture or flashing headlights — and the others follow the chain from there.\nIf a driver waves you through, go, but slowly and still looking. Waving does not remove their responsibility for a mistake, nor yours.',
  mistake:'Four drivers all creeping forward at once. Decide, communicate, and if you waive, keep still until the other car has passed.',
  quiz:{q:'Who goes first by the rule?', options:['you','e','n','w'], answer:[], why:'Nobody has priority — every car has someone on its right. One driver must waive.'},
  stvo:'§ 8 Abs. 1 StVO, § 1 StVO (mutual consideration)' },
{ id:'rvl-turnleft', ch:1, title:'Turning left at an unsigned crossing', de:'Linksabbieger und Gegenverkehr',
  road:{}, actors:[{id:'you',kind:'you',from:'S',turn:'left'},{id:'b',kind:'car',from:'N',label:'Oncoming car'}],
  order:[['b'],['you']],
  captions:['You want to turn left. A car comes straight toward you from the north.','Right-before-left says nothing about oncoming cars — but the turning rule does: the car going straight goes first.','Oncoming traffic has passed. You turn.'],
  rule:'"Right before left" only sorts cars from the side. For a car coming toward you, a second rule applies: whoever turns left must let oncoming traffic through — cars, trams, bicycles and e-scooters.',
  mistake:'Believing that "nobody is on my right" means "I can go". Oncoming traffic is a different rule and always wins over a left turn.',
  stvo:'§ 9 Abs. 3 StVO' },
{ id:'rvl-rightturn', ch:1, title:'You turn right, the oncoming car turns left', de:'Rechtsabbieger vor Linksabbieger',
  road:{}, actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'b',kind:'car',from:'N',turn:'left',label:'Oncoming car turning left'}],
  order:[['you'],['b']],
  captions:['Both of you want to enter the same street on the east side.','You only turn right — you never cross the other car\'s lane. The left-turner must wait for you.','After you, the other car turns.'],
  rule:'A right turn crosses nothing; a left turn crosses the oncoming lane. So the car turning right goes first and the car turning left waits, even though you are both heading for the same street.',
  mistake:'Hesitating when you turn right because the oncoming car "was there first". Being first at the crossing is not a rule.',
  stvo:'§ 9 Abs. 3 StVO' },
{ id:'rvl-off-sign', ch:1, title:'Off switch 1: any priority sign', de:'Sobald ein Schild steht, gilt Rechts vor Links nicht mehr',
  road:{wait:['S']}, signs:[{code:'205',at:'S'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',from:'W',label:'Car from the left'}],
  order:[['b'],['you']],
  captions:['A give-way triangle stands on your approach. The other car comes from your left.','Left or right no longer matters: the sign says you give way to everything on the crossing street.','Only when the street is clear may you go.'],
  rule:'Right-before-left is only the fallback. As soon as a sign regulates priority — the give-way triangle, a stop sign, the yellow diamond or "Vorfahrt" — the sign wins and left/right is irrelevant.',
  mistake:'Seeing a car on your left and thinking "I\'m on its right, I go" — while a triangle stands two metres beside you. Always check for a sign first, then for the right side.',
  stvo:'§ 8 Abs. 1 Satz 2 StVO' },
{ id:'rvl-off-driveway', ch:1, title:'Off switch 2: coming out of a driveway or car park', de:'Aus Grundstücken und Parkplätzen: keine Vorfahrt',
  road:{type:'straight', driveway:{y:150,label:'Parkplatz'}},
  actors:[{id:'you',kind:'you',from:'S'},{id:'d',kind:'car',path:'M200 150 L70 150 Q30 150 30 110 L30 -330',stop:130,label:'Car leaving the car park'}],
  order:[['you'],['d']],
  captions:['A car leaves a supermarket car park on your right. Technically it is "on your right".','It has no priority at all: whoever enters the road from a property, car park or over a lowered kerb must let everyone pass.','Only after you have passed may it pull out.'],
  rule:'A driveway, petrol station, car park, field track or a lowered kerb is not a "street". Anyone coming out of one must wait for all traffic on the road — cars, bikes on the cycle path, and pedestrians on the pavement. Right-before-left does not apply.\nThe same holds when you are the one leaving: creep out, look both ways, let everyone pass.',
  mistake:'Treating a lowered kerb like a normal side street. If the pavement continues across the entrance at the same level, the car coming out has to wait.',
  berlin:'Look for the pavement: at an Einfahrt the footpath runs through without a break. At a real side street the pavement ends with a kerb.',
  stvo:'§ 10 StVO' },
{ id:'rvl-off-calmed', ch:1, title:'Off switch 3: leaving a living street', de:'Ausfahrt aus dem verkehrsberuhigten Bereich',
  road:{}, signs:[{code:'325.2',at:'E'}], labels:[{x:220,y:-100,text:'Spielstraße'}],
  actors:[{id:'you',kind:'you',from:'E',turn:'straight'},{id:'b',kind:'car',from:'N',label:'Car on the normal street'}],
  order:[['b'],['you']],
  captions:['You leave a living street (the blue sign with the playing child) and want to cross a normal street.','The car from the north is on your left — but you have no priority when leaving a living street. It goes first.','The street is clear. You cross.'],
  rule:'When you leave a traffic-calmed area (verkehrsberuhigter Bereich) or a pedestrian zone, you are treated like someone coming out of a driveway: everyone on the street goes first, whether they come from the left or the right.',
  mistake:'Applying right-before-left from inside a living street. The "end" sign is your cue: no priority for you.',
  stvo:'§ 10 StVO' },
{ id:'rvl-oneway', ch:1, title:'One-way streets do not change the rule', de:'Einbahnstraße: Rechts vor Links gilt weiter',
  road:{oneway:{E:'in'}}, signs:[{code:'267',x:112,y:86,size:34}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',from:'E',label:'Car from the one-way street'}],
  order:[['b'],['you']],
  captions:['The street on your right is a one-way street flowing toward you.','A one-way street is a normal street for priority: the car from the right goes first.','Then you.'],
  rule:'A one-way street only says which direction traffic flows. It gives nobody priority and takes it from nobody. Cars coming out of a one-way street on your right go first.\nBonus: since traffic can only come out of it, you know exactly where to look.',
  mistake:'Thinking a one-way street is a "small" street that must give way. Only signs decide that.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'rvl-small-road', ch:1, title:'Big road, tiny side street — still right before left', de:'Breite Straße, schmale Nebenstraße ohne Schild',
  road:{narrow:['E','W']}, labels:[{x:200,y:-62,text:'no name, no sign',size:13}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',path:'M330 -18 L-330 -18',stop:258,label:'Car from the small street'}],
  order:[['b'],['you']],
  captions:['You are on the wide street. A narrow street without a name sign joins from the right. No priority sign anywhere.','Width, importance and street names count for nothing. The narrow street is a public road, so the car from the right goes first.','Only then do you continue. On a road like this, slow down at every little gap in the houses.'],
  rule:'Right-before-left does not care how wide, how busy or how important a street looks, and it does not care whether the street has a name plate. If it is a public, paved street and there is no priority sign, the car coming out of it from your right goes first.\nThe only exceptions are field and forest tracks, driveways and car parks, living streets and pedestrian zones — from those, nobody has priority.',
  mistake:'Assuming "my road is obviously the main road". Unless you have seen a yellow diamond or a "Vorfahrt" triangle, you are not on a main road in the legal sense.',
  berlin:'Typical in Lankwitz, Mariendorf or Lichterfelde: a long straight residential street with small side streets every 100 m, most of them unsigned. Locals drive 30 there for a reason.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'rvl-sign-back', ch:1, title:'Reading the backs of the signs', de:'Schilder von hinten erkennen',
  road:{narrow:['E','W'],wait:['E','W']}, signs:[{code:'205',at:'E',back:true,size:30},{code:'205',at:'W',back:true,size:30}], labels:[{x:200,y:-62,text:'no sign for you',size:13}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',path:'M330 -18 L-330 -18',stop:258,label:'Car from the side street'}],
  order:[['you'],['b']],
  captions:['Same kind of crossing — but look at the corners: a grey triangle seen from behind. That is the back of a give-way sign facing the side street.','So the side street gives way, even though there is no sign on your road. You go first.','Then the side-street car. No grey triangle on the corners? Then assume right-before-left.'],
  rule:'Signs are placed for the driver they address, so from the main road you often see nothing. Learn to read the backs: a grey downward triangle is a give-way sign, a grey octagon a stop sign. If the side street has one, you have priority. If the corners are empty, right-before-left applies and you must slow down.\nStrictly, the main road should carry its own sign 306 or 301 in that case — but in Berlin it is sometimes missing.',
  mistake:'Trusting the missing sign on your own road as proof of priority. Missing is not the same as "priority road".',
  stvo:'§ 8 Abs. 1 StVO, § 39 StVO' },
{ id:'rvl-feldweg', ch:1, title:'Unpaved track from the right: no priority', de:'Feld- und Waldwege',
  road:{dirt:['E']}, labels:[{x:200,y:-52,text:'Feldweg (unpaved)',size:13}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',path:'M330 -14 L74 -14 Q30 -14 30 -60 L30 -330',stop:256,label:'Car from the field track'}],
  order:[['you'],['b']],
  captions:['A dirt track comes out of the fields on your right. A car is waiting in it.','Field and forest tracks are not streets in the sense of the rule: whoever comes out of one must give way, even from the right.','You pass first, then the track car pulls out.'],
  rule:'Right-before-left only applies between real streets. Anyone coming from a field or forest track (Feld- oder Waldweg) onto a road has to wait for all traffic, from both sides — just like from a driveway. What counts is what the track looks like: unpaved, no kerbs, clearly not built for through traffic.',
  mistake:'Waiting for a tractor on a dirt track "because it is on the right" — and confusing the driver behind you.',
  berlin:'Rare inside the city, common on the edges: Gatow, Lübars, Blankenfelde, the Grunewald forest roads, and the tracks along the Havel.',
  stvo:'§ 8 Abs. 1 Satz 2 Nr. 2 StVO' },
{ id:'rvl-zone30', ch:1, title:'Inside a 30 zone: a cyclist from the right', de:'Tempo-30-Zone: Radfahrer von rechts',
  road:{}, signs:[{code:'274.1',at:'S'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'bk',kind:'bike',from:'E',label:'Cyclist from the right'}],
  order:[['bk'],['you']],
  captions:['You enter a 30 zone. Inside, crossings usually have no signs at all.','A cyclist comes from your right. Bicycles are vehicles: right-before-left applies to them too.','After the cyclist has passed, you go.'],
  rule:'A 30-km/h zone is planned to be sign-free inside: every crossing is right-before-left unless marked otherwise. Cyclists, e-scooters and even horse carts count as vehicles from the right.',
  mistake:'Expecting cyclists to stop for cars. A cyclist from the right has exactly the same priority as a car from the right.',
  berlin:'Berlin has hundreds of 30 zones. The sign stands once at the entrance; afterwards there are no reminders. If you did not see a priority sign for a while, assume right-before-left.',
  stvo:'§ 8 Abs. 1 StVO, § 45 Abs. 1c StVO' },
{ id:'rvl-turn-into', ch:1, title:'Turning into a side street: pedestrians first', de:'Beim Abbiegen: Fußgänger haben Vorrang',
  road:{}, actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'p',kind:'ped',from:'S',turn:'ped',label:'Pedestrian'}],
  order:[['p'],['you']],
  captions:['You turn right into a quiet side street. A pedestrian is crossing that street.','Whenever you turn, pedestrians crossing the street you are entering go first — with or without a zebra crossing.','After they have crossed, you complete the turn.'],
  rule:'Turning drivers must take special care of pedestrians crossing the street they turn into and wait if necessary. This holds at every crossing, signed or not, and for left and right turns alike.',
  mistake:'Nosing into the crossing to "encourage" the pedestrian to hurry. Wait behind the corner.',
  stvo:'§ 9 Abs. 3 Satz 3 StVO' },

// ===== Chapter 2: Signs =====
{ id:'s-205', ch:2, title:'Give way: the upside-down triangle', de:'Vorfahrt gewähren',
  road:{wait:['S']}, signs:[{code:'205',at:'S'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'a',kind:'car',from:'E',label:'Car from the right'},{id:'b',kind:'car',from:'W',label:'Car from the left'}],
  order:[['a','b'],['you']],
  captions:['The triangle on your approach means: the crossing street has priority.','Cars from both sides pass. You slow down; a full stop is only needed if someone is coming.','Once clear, you go without stopping.'],
  rule:'The upside-down triangle means "give way". You must let everything on the crossing street pass, from left and right. If nobody is coming you do not have to stop — but you must approach slowly enough that you could.\nThe dashed line across your lane (the wait line) shows where to wait.',
  mistake:'Confusing it with the stop sign and stopping every time — or the opposite: rolling through at 40 km/h "because it is only a triangle".',
  stvo:'§ 8 Abs. 2 StVO, Zeichen 205' },
{ id:'s-206', ch:2, title:'Stop means stop, even on an empty street', de:'Stoppschild',
  road:{stop:['S']}, signs:[{code:'206',at:'S'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'a',kind:'car',from:'W',delay:2.2,through:true,label:'Car from the left'}],
  order:[['you'],['a']], captions:['A stop sign. The street looks empty.','You stop completely at the solid line — wheels not turning, about three seconds — and look both ways.','Then you go. If you cannot see far enough from the line, stop again where you can.'],
  rule:'At a stop sign you must come to a complete halt at the stop line, even at 3 a.m. with nobody around. Then give way like at the triangle. If the line is set back and you cannot see the crossing street, stop a second time at the edge where you can.',
  mistake:'The rolling stop. Police in Berlin do watch stop signs near schools and it costs money.',
  stvo:'§ 41 Abs. 1 StVO, Zeichen 206' },
{ id:'s-301', ch:2, title:'"Vorfahrt": priority at the next crossing only', de:'Zeichen 301 – einmalige Vorfahrt',
  road:{wait:['E','W']}, signs:[{code:'301',at:'S'},{code:'205',at:'E'},{code:'205',at:'W'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',from:'E',label:'Car from the right'}],
  order:[['you'],['b']],
  captions:['The upright triangle on your approach: you have priority — at this one crossing.','The car from the right has a give-way sign and waits, although it is on your right.','Careful after this crossing: at the next one, right-before-left is back unless another sign appears.'],
  rule:'Sign 301 gives you priority at the next crossing only. After that, the sign is "used up". Do not assume the street stays a priority street — that is what the yellow diamond is for.',
  mistake:'Treating 301 like a priority road and sailing through the following crossing at speed.',
  stvo:'Zeichen 301' },
{ id:'s-306', ch:2, title:'The yellow diamond: a priority road', de:'Vorfahrtstraße',
  road:{wait:['E','W']}, signs:[{code:'306',at:'S'},{code:'205',at:'E'},{code:'205',at:'W'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'a',kind:'car',from:'E',label:'Car from the right'},{id:'b',kind:'car',from:'W',label:'Car from the left'}],
  order:[['you'],['a'],['b']],
  captions:['You are on a priority road (yellow diamond). Both side streets have give-way triangles.','You go first at every crossing until the diamond is crossed out.','Between the two side-street cars, right-before-left decides: the east car has an empty right side and goes.','The west car goes last.'],
  rule:'On a priority road you have priority at every crossing until sign 307 (the crossed-out diamond) ends it. The diamond is repeated after every crossing so you can always check.\nSide-street cars sort themselves by right-before-left once you have passed.',
  mistake:'Forgetting that priority only covers the crossing itself. Pedestrians crossing the side street when you turn, and oncoming traffic when you turn left, still go before you (next scene).',
  berlin:'Berlin main roads such as Tempelhofer Damm, Schloßstraße or Prenzlauer Allee are priority roads — but often with traffic lights, and lights beat signs.',
  stvo:'Zeichen 306' },
{ id:'s-306-left', ch:2, title:'Turning left off a priority road', de:'Von der Vorfahrtstraße nach links abbiegen',
  road:{wait:['E','W']}, signs:[{code:'306',at:'S'},{code:'306',at:'N'},{code:'205',at:'E'},{code:'205',at:'W'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'left'},{id:'b',kind:'car',from:'N',through:true,label:'Oncoming car on the priority road'},{id:'c',kind:'car',from:'E',label:'Car from the side street'}],
  order:[['b'],['you'],['c']],
  captions:['You are on the priority road, turning left. Oncoming traffic is also on the priority road. A side-street car waits.','Priority road or not, a left turn waits for oncoming traffic. The straight car passes first.','Now you turn — the side-street car still waits for you because you are on the priority road.','Finally the side-street car goes.'],
  rule:'The diamond ranks you above side streets, but not above oncoming cars on the same road. Turning left, you let them pass first. The side-street car waits for both of you.',
  mistake:'"I am on the priority road, so I turn." The oncoming car is on the same priority road — and straight beats left.',
  stvo:'§ 9 Abs. 3 StVO, Zeichen 306' },
{ id:'s-1002-follow', ch:2, title:'Bending priority road: following the bend', de:'Abknickende Vorfahrt – Sie folgen dem Knick',
  road:{wait:['N','W']}, signs:[{code:'306',at:'S'},{code:'1002-10',at:'S'},{code:'205',at:'N'},{code:'205',at:'W'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'c',kind:'car',from:'N',label:'Car from the north (side street)'}],
  order:[['you'],['c']],
  captions:['The plate under the diamond shows the priority road bending to the right. You follow the thick line.','You keep priority through the bend — but you must signal right, because you are changing direction.','The car from the north is on a side street now and waits.'],
  rule:'The thick line on the plate is the priority road; the thin lines are side streets. If you follow the thick line you keep priority, even though you are turning — and because you are turning, your indicator is mandatory.',
  mistake:'Not signalling because "I just follow the road". Legally you are turning; other drivers need the indicator to know you stay on the priority road.',
  berlin:'Bending priority roads are common where an old village street meets a newer grid — for example around Lankwitz Kirche or in Lichterfelde.',
  stvo:'§ 9 Abs. 1 StVO, Zeichen 306 mit Zusatzzeichen 1002' },
{ id:'s-1002-straight', ch:2, title:'Bending priority road: going straight off it', de:'Abknickende Vorfahrt – Sie verlassen die Vorfahrtstraße',
  road:{wait:['N','W']}, signs:[{code:'306',at:'S'},{code:'1002-10',at:'S'},{code:'205',at:'N'},{code:'205',at:'W'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',from:'E',turn:'left',through:true,label:'Car following the bend'},{id:'c',kind:'car',from:'N',label:'Car from the side street'}],
  order:[['b'],['you'],['c']],
  captions:['Same crossing. This time you drive straight on, which means leaving the priority road.','A car from the east follows the bend (its thick line). It is on the priority road, you are leaving it: it goes first.','Now you cross. No indicator is needed for going straight — though it does not hurt.','The side-street car from the north goes last.'],
  rule:'Leaving the bending priority road counts like turning off it: everything that follows the thick line goes first. Toward the side streets you still have priority because you come from the priority road.\nGoing straight needs no indicator; if you turn left or right off the priority road, signal as usual.',
  mistake:'Thinking "I am on the priority road, I go straight, so I am first". The road bends away — straight means you are leaving it.',
  stvo:'§ 8, § 9 StVO, Zusatzzeichen 1002' },
{ id:'s-1002-side', ch:2, title:'Bending priority road, seen from the side street', de:'Abknickende Vorfahrt – Sie kommen aus der Nebenstraße',
  road:{wait:['N','E']}, signs:[{code:'205',at:'N'},{code:'1002-11',at:'N'},{code:'205',at:'E'},{code:'306',at:'W'},{code:'1002-10',at:'W'}],
  actors:[{id:'you',kind:'you',from:'N'},{id:'b',kind:'car',from:'W',turn:'right',through:true,label:'Car on the priority road'},{id:'c',kind:'car',from:'E',label:'Car from the other side street'}],
  order:[['b'],['you'],['c']],
  captions:['You come from a side street (give-way triangle with a bent-line plate). The priority road runs from the west and bends to the south.','The car on the thick line goes first, wherever it goes.','Between the two side streets, right-before-left decides: from your point of view the east car is on your left — you go.','The east car goes last.'],
  rule:'From a side street: every car on the thick line goes before you, no matter which way it turns. Among the side streets, the normal right-before-left rule decides.',
  mistake:'Reading the plate the wrong way round. The plate is drawn from where you stand: the arm pointing down is your street.',
  stvo:'Zeichen 205 mit Zusatzzeichen 1002' },
{ id:'s-307', ch:2, title:'End of the priority road', de:'Ende der Vorfahrtstraße',
  road:{}, signs:[{code:'307',at:'S'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',from:'E',label:'Car from the right'}],
  order:[['b'],['you']],
  captions:['You have been on a priority road for a while. Now the crossed-out diamond appears.','From the next crossing on, right-before-left applies again. The car from the right goes first.','Then you.'],
  rule:'The crossed-out diamond switches your priority off. The very next crossing is a normal crossing: look right. Often the sign stands where a main road enters a residential area or 30 zone.',
  mistake:'Missing the small sign after kilometres of priority road. Watch for it when the street gets narrower or a 30-zone sign appears.',
  stvo:'Zeichen 307' },
{ id:'s-209', ch:2, title:'"Turn right only" onto a main road', de:'Vorgeschriebene Fahrtrichtung rechts',
  road:{wait:['S']}, signs:[{code:'205',at:'S'},{code:'209',at:'S'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'b',kind:'car',from:'W',through:true,label:'Car on the main road'}],
  order:[['b'],['you']],
  captions:['Blue arrow: you may only turn right here. The give-way triangle says the main road has priority.','The main-road car passes.','A gap — you turn right. Left or straight would be a violation, however tempting.'],
  rule:'A blue circle with an arrow prescribes the only allowed direction. Together with the triangle it is Berlin\'s standard way of feeding side streets onto busy main roads: turn right, join the flow, and make your left turn later at a traffic light.',
  mistake:'Turning left across a main road anyway "because it is quiet". It is still a fine, and left turns without a light are where side-impact crashes happen.',
  stvo:'Zeichen 209, § 41 StVO' },

// ===== Chapter 3: Turning =====
{ id:'t-left-oncoming', ch:3, title:'The unprotected left turn', de:'Linksabbiegen ohne Pfeil',
  road:{bike:['NS']}, signs:[{code:'306',at:'S'},{code:'306',at:'N'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'left'},{id:'b',kind:'car',from:'N',through:true,label:'Oncoming car'},{id:'bk',kind:'bike',from:'N',turn:'bike',through:true,delay:.5,label:'Oncoming cyclist'}],
  order:[['b','bk'],['you']],
  captions:['You want to turn left. A car and a cyclist come toward you.','Everything coming straight toward you goes first: cars, cyclists on the cycle path, trams, e-scooters.','Now the road is clear. Turn — and look once more at the cycle path.'],
  rule:'Turning left, you must let all oncoming traffic through. Cyclists on the cycle path beside the road are easy to overlook: they are further out and often faster than you think. Look at the cycle path last, right before you turn.',
  mistake:'Watching only the car lane. The oncoming cyclist is the classic left-turn accident in Berlin.',
  berlin:'Berlin cycle paths often run on the pavement, two metres from the road. From the car they are hidden behind parked cars — lean forward and look.',
  stvo:'§ 9 Abs. 3 StVO' },
{ id:'t-left-vs-left', ch:3, title:'Two cars turning left toward each other', de:'Linksabbieger vor einander',
  road:{}, actors:[{id:'you',kind:'you',from:'S',turn:'left'},{id:'b',kind:'car',from:'N',turn:'left',label:'Oncoming car turning left'}],
  order:[['you','b']],
  captions:['You turn left, and the oncoming car also turns left.','In Germany you pass in front of each other ("voreinander"): turn short, nose to nose, and both go at the same time.'],
  rule:'Two opposing left-turners do not have to wait for each other: they pass in front of each other, keeping to the right of the centre of the crossing. Neither has priority, both may go.\nOnly if road markings or the layout make it impossible (very large or offset crossings) do they pass behind each other.',
  mistake:'Swinging wide and driving behind the other car, as is common in some other countries. That blocks the crossing and confuses the other driver.',

{ id:'t-left-ped', ch:3, title:'Left turn: pedestrians on the street you enter', de:'Linksabbiegen – Fußgänger in der Zielstraße',

  order:[['p'],['you']],
  captions:['No oncoming traffic, but a pedestrian is crossing the street you want to enter.','The pedestrian goes first. Wait before the crossing or in the middle, without blocking others.','Then turn.'],
  rule:'Pedestrians who cross the street you turn into always go before you — no zebra needed. This is true on priority roads, with a green light, everywhere.',
  mistake:'Completing the turn and stopping in the side street with your nose in the crosswalk. Wait earlier.',

{ id:'t-right-bike', ch:3, title:'Right turn across the cycle path', de:'Rechtsabbiegen – Radfahrer geradeaus',

  captions:['You want to turn right. A cyclist rides behind you, on the cycle path to your right.','The cyclist going straight has priority over your turn. Shoulder check!','After the cyclist has passed, you turn.'],

{ id:'t-right-bike-contra', ch:3, title:'Two-way cycle path: bikes from the "wrong" side', de:'Zweirichtungsradweg',

  captions:['The warning sign with the plate says cyclists cross from both directions.','A cyclist comes from the north on the same cycle path — toward you. It has priority too.','Now turn, and look both ways along the path first.'],

{ id:'t-right-ped', ch:3, title:'Right turn: pedestrians crossing', de:'Rechtsabbiegen – Fußgänger',
  road:{}, signs:[{code:'306',at:'S'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'p',kind:'ped',from:'S',turn:'ped',label:'Pedestrian'},{id:'p2',kind:'ped',path:'M100 -132 L100 132',stop:30,delay:.6,label:'Pedestrian'}],
  order:[['p','p2'],['you']],
  captions:['Pedestrians cross the side street you are turning into.','They go first — from both directions. Stop before the corner, not on the crossing.','Then turn slowly.'],
  rule:'Pedestrians crossing the street you turn into have priority. Wait far enough back that they can pass in front of you comfortably; do not creep forward.',

{ id:'t-uturn', ch:3, title:'The U-turn', de:'Wenden',
  road:{}, actors:[{id:'you',kind:'you',from:'S',turn:'uturn',travel:3.2},{id:'b',kind:'car',from:'N',through:true,label:'Oncoming car'},{id:'c',kind:'car',from:'W',through:true,delay:.6,label:'Car from the left'}],

// ===== Chapter 4: Traffic lights =====
{ id:'l-green-ped', ch:4, title:'Green light, but pedestrians have green too', de:'Grün heißt nicht frei',
  road:{lights:['S','N','E','W'],stop:['S','N','E','W'],zebra:[]}, lights:[{at:0,S:'green',N:'green',E:'red',W:'red'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'p',kind:'ped',from:'S',turn:'ped',label:'Pedestrian'}],
  order:[['p'],['you']],
  captions:['Your light is green. You turn right — and the pedestrians crossing the side street also have green.','Green means "you may go if it is safe". Pedestrians on the crossing you turn into go first.','After they have crossed, you turn.'],
  rule:'At most Berlin crossings pedestrians get green at the same time as the parallel cars. Your green light does not beat them: turning drivers wait for pedestrians and cyclists crossing the street they enter.',
  mistake:'Interpreting green as "the intersection is mine".',
  stvo:'§ 37 Abs. 2 StVO, § 9 Abs. 3 StVO' },
{ id:'l-green-left', ch:4, title:'Green light, turning left, no arrow', de:'Linksabbiegen bei Grün ohne Pfeil',
  road:{lights:['S','N'],stop:['S','N']}, lights:[{at:0,S:'green',N:'green'},{at:5.2,S:'yellow',N:'yellow'},{at:6,S:'red',N:'red'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'left',stop:300,travel:2},{id:'b',kind:'car',from:'N',through:true,label:'Oncoming car'},{id:'b2',kind:'car',from:'N',through:true,delay:.7,label:'Second oncoming car'}],
  order:[['b'],['b2'],['you']],
  captions:['Green for you and for the oncoming lane. No left arrow.','Drive into the crossing and wait there, near the middle, with your wheels straight.','Oncoming cars keep coming as long as their light is green.','When the light turns yellow and the oncoming cars stop, complete the turn — you may leave the crossing even on red.'],
  rule:'Without a left arrow, green does not protect your left turn: oncoming traffic goes first. Enter the crossing (so you block nobody behind you), wait with straight wheels, and turn when there is a gap or when the light changes and oncoming traffic stops. Clearing the crossing on yellow or red is allowed and expected.',
  mistake:'Waiting behind the stop line for a gap. You will wait all day and block the lane. Waiting in the middle with turned wheels is the other mistake: if you are hit from behind you get pushed into oncoming traffic.',
  berlin:'Many Berlin lights add a green left arrow only at the end of the phase ("Nachlaufpfeil"). Wait for it in the middle of the crossing.',
  stvo:'§ 37 Abs. 2 StVO, § 9 Abs. 3 StVO' },
{ id:'l-arrow', ch:4, title:'Green arrow signal: the protected left turn', de:'Grüner Pfeil im Signalgeber',
  road:{lights:['S','N'],stop:['S','N']}, lights:[{at:0,S:'arrow-left',N:'red'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'left'},{id:'b',kind:'car',from:'N',label:'Oncoming car at red',waitText:'ROT'}],
  order:[['you']],
  captions:['Your signal shows a green arrow pointing left. The oncoming lane has red.','A lit green arrow means the conflicting traffic is stopped: you may turn without waiting for oncoming cars.'],
  rule:'A green arrow lit inside the traffic light is a protected phase: whoever would cross your path has red. You still watch for pedestrians and cyclists who cross on red, but you do not have to wait for cars.\nDo not confuse this with the small green arrow plate next to a red light (next scene) — that one gives no protection at all.',
  mistake:'Hesitating on a green arrow and losing the short phase for everyone behind you. Arrow lit = go.',
  stvo:'§ 37 Abs. 2 Nr. 1 StVO' },
{ id:'l-gruenpfeil', ch:4, title:'The green arrow plate: right on red, after stopping', de:'Grünpfeilschild',
  road:{lights:['S','W'],stop:['S','W'],gruenpfeil:['S'],bike:['NS']}, lights:[{at:0,S:'red',W:'green'}],
  actors:[{id:'you',kind:'you',from:'S',turn:'right'},{id:'bk',kind:'bike',from:'S',turn:'bike',through:true,delay:.3,label:'Cyclist on the cycle path'},{id:'w',kind:'car',from:'W',through:true,label:'Car with green from the left'}],
  order:[['bk','w'],['you']],
  captions:['Your light is red, but a small black plate with a green arrow hangs beside it.','First: stop completely at the stop line. Then look: the cyclist on the cycle path and the cross traffic with green have priority.','Only when you hinder nobody may you turn right on red.'],
  rule:'The green arrow plate allows a right turn at red — after a full stop at the line and only if you endanger or hinder nobody: not the cars with green, not cyclists on the cycle path, not pedestrians on the crossing. If in doubt, wait for green. Nobody may honk at you for waiting.',
  mistake:'Rolling around the corner without stopping. That is treated as running a red light: fine, points, possibly a driving ban.',
  berlin:'The Grünpfeil was invented in East Berlin (GDR) and is still common in the eastern districts. Some crossings now have a bicycle-only version.',
  stvo:'§ 37 Abs. 2 Nr. 1 Satz 8–10 StVO, Zeichen 720' },
{ id:'l-yellow', ch:4, title:'Yellow: stop if you safely can', de:'Gelb',
  road:{lights:['S'],stop:['S']}, lights:[{at:0,S:'green'},{at:.5,S:'yellow'},{at:1.3,S:'red'},{at:3.6,S:'redyellow'},{at:4.2,S:'green'}],
  actors:[{id:'you',kind:'you',from:'S',goAt:4.4}], order:[['you']], duration:7.5, capAt:[0,1.0,4.4],
  captions:['The light turns yellow while you approach.','Yellow means: stop before the crossing — unless you are so close that stopping would be dangerous. Red-yellow means: get ready, but wait for green.','Green: go, looking left and right as you enter.'],
  rule:'Yellow means "wait for the next signal, stop before the crossing". Only if you cannot stop safely any more may you continue. Red-and-yellow together is the pre-green: do not move yet. In Berlin the yellow phase lasts about three seconds at 50 km/h.',
  mistake:'Accelerating on yellow. Cameras in Berlin trigger from the first moment of red.',
  stvo:'§ 37 Abs. 2 Nr. 1 StVO' },
{ id:'l-flash', ch:4, title:'Lights off or flashing yellow: back to the signs', de:'Ampel aus – Schilder gelten',
  road:{lights:['S','N','E','W'],wait:['S','N']}, signs:[{code:'205',at:'S'},{code:'205',at:'N'},{code:'306',at:'W'},{code:'306',at:'E'}], lights:[{at:0,S:'flash',N:'flash',E:'flash',W:'flash'}],
  actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',from:'W',through:true,label:'Car on the priority road'}],
  order:[['b'],['you']],
  captions:['The traffic lights are flashing yellow (or switched off at night).','Now the signs under the lights count. Your triangle: give way to the priority road.','Once clear, you cross.'],
  rule:'When lights are off or flash yellow, the signs mounted on the same posts apply — usually a triangle for the side street and a diamond for the main road. If there are no signs at all, right-before-left applies.',
  mistake:'Assuming a dead light means "everyone is careful, I just go". Look for the sign on the pole.',
  berlin:'Many Berlin lights switch off between about 23:00 and 5:00 in quiet areas. The yellow flash is the warning that the signs now rule.',
  stvo:'§ 37 Abs. 2 StVO, § 39 Abs. 1 StVO' },
{ id:'l-bikebox', ch:4, title:'The bike box at the stop line', de:'Aufstellfläche für Radfahrer',
  road:{lights:['S'],bikeBox:true,bikeLane:['S']}, lights:[{at:0,S:'red'},{at:3.4,S:'redyellow'},{at:3.9,S:'green'}],
  actors:[{id:'you',kind:'you',from:'S',stop:246,goAt:4.7},{id:'bk',kind:'bike',path:'M52 330 L52 -330',stop:270,label:'Cyclist',goAt:4.0}],
  order:[['bk'],['you']], duration:8, capAt:[0,1.6,4.0],
  captions:['Red. In front of the car stop line is a green box with a bicycle symbol.','You stop behind the first line. Cyclists ride past you on the lane and wait in the box, in front of you, where you can see them.','Green: the cyclists start first, you follow.'],
  rule:'The green box is for bicycles only. Cars stop at the line behind it. This puts cyclists where the driver can see them and lets them start first, especially before a right turn.',
  mistake:'Stopping inside the box. It is a fine and takes the cyclists\' safe spot away.',
  stvo:'§ 41 StVO, Zeichen 340 / Aufstellfläche' },

// ===== Chapter 5: Odd-shaped crossings =====
{ id:'j-T-bar', ch:5, title:'T-junction: you are on the through street', de:'Einmündung – Sie fahren auf der durchgehenden Straße',
  road:{type:'T',missing:'N'}, actors:[{id:'you',kind:'you',from:'E'},{id:'b',kind:'car',from:'S',turn:'left',label:'Car from the side street'}],
  order:[['you'],['b']],
  captions:['A T-junction without signs. You drive along the top of the T; a car comes out of the stem and wants to turn left.','The stem car is on your left, so you go first.','Then it turns.'],
  rule:'A T-junction without signs is a normal right-before-left crossing. There is no "the through street has priority" rule in Germany. Here the side-street car happens to be on your left, so you go — but see the next scene.',
  mistake:'Believing the straight road automatically has priority.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'j-T-stem', ch:5, title:'T-junction: you come out of the stem', de:'Einmündung – Sie kommen aus der Nebenstraße',
  road:{type:'T',missing:'N'}, actors:[{id:'you',kind:'you',from:'S',turn:'left'},{id:'e',kind:'car',from:'E',label:'Car from the right'},{id:'w',kind:'car',from:'W',label:'Car from the left'}],
  order:[['e'],['you'],['w']],
  captions:['You come out of the stem and turn left. Cars come from both sides along the top.','The car from the right goes first — normal rule.','Now the surprise: the car from the left had you on its right. You go before it, although you come from the "small" street.','It goes last.'],
  rule:'Without signs, the stem of a T is not inferior. You go before the car from your left even though you turn onto "their" road. Most Berlin T-junctions on bigger streets do have a triangle — but many in residential areas do not.',
  mistake:'Both the classic errors: the stem driver waiting for everybody, and the through driver from the left not slowing down at all.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'j-diag-left', ch:5, title:'A diagonal street from the left', de:'Schräg einmündende Straße von links',
  road:{diag:{dir:'W',angle:-35}}, actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',path:fromAngle(55,'N'),label:'Car from the diagonal street'}],
  order:[['you'],['b']],
  captions:['A street joins at a sharp angle from your left-rear.','The angle does not matter. The other car comes from your left, so you go first.','Then it merges.'],
  rule:'Right-before-left is about which side, not which angle. Draw an imaginary line through the crossing: cars coming from anywhere on your left side wait for you, cars from anywhere on your right side go first.',
  mistake:'Being unsure because the street is "sort of behind me". Left is left.',
  berlin:'Berlin is full of diagonal streets from old village roads: Kurfürstendamm and Uhlandstraße in Charlottenburg, or the Steglitz "Schloßstraße" area.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'j-diag-right', ch:5, title:'A diagonal street from behind-right', de:'Spitzwinklige Einmündung von rechts',
  road:{diag:{dir:'E',angle:35}}, actors:[{id:'you',kind:'you',from:'S'},{id:'b',kind:'car',path:fromAngle(-55,'N'),label:'Car from the diagonal street'}],
  order:[['b'],['you']],
  captions:['Now the sharp-angled street joins from your right-rear. You can barely see it in your mirror.','It is on your right: the other car goes first — even though it comes "from behind".','After it has merged, you go.'],
  rule:'The trap version: a street that meets yours at a sharp angle from behind-right still counts as "from the right". You must let that car go first. Check your right mirror and shoulder before such crossings.',
  mistake:'Not noticing the side street at all. Look for the gap in the buildings and the kerb ending.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'j-5arms', ch:5, title:'Five arms: look at the next one to your right', de:'Fünfarmige Kreuzung',
  road:{extra:[{angle:-45}]}, actors:[{id:'you',kind:'you',from:'S'},{id:'se',kind:'car',path:fromAngle(-45,'N'),label:'Car from the diagonal street on your right'},{id:'w',kind:'car',from:'W',label:'Car from the west'}],
  order:[['se'],['you'],['w']],
  captions:['Five streets meet, no signs. Cars from your right-rear and from the west.','Only the arm next to you on the right matters: that car goes first.','Then you. The west car had you on its right and waits.','It goes last.'],
  rule:'With more than four arms the rule is the same: give way to the arm immediately on your right. Once that is clear, you may go. Never try to sort all five at once — one neighbour at a time.',
  mistake:'Freezing. Look right, go when it is empty, and let the cars on your left sort themselves out.',
  stvo:'§ 8 Abs. 1 StVO' },
{ id:'j-zipper', ch:5, title:'Lane ends: the zipper', de:'Reißverschlussverfahren',
  road:{type:'straight',oneway:{S:'in',N:'out'}}, extras:['<path d="M60 -20 L60 -330" stroke="var(--paint)" stroke-width="3"/><path d="M60 -20 L2 -120" stroke="var(--paint)" stroke-width="3"/><path d="M0 -120 V-330" stroke="var(--paint)" stroke-width="3" stroke-dasharray="14 10"/><path d="M0 66 V-20" stroke="var(--paint)" stroke-width="3" stroke-dasharray="14 10"/><path d="M40 -60 L20 -100 L30 -100 L30 -96 L40 -96 L40 -100 L50 -100 Z" fill="var(--paint)" opacity=".9"/>'],
  actors:[{id:'a1',kind:'car',path:'M-30 330 L-30 -330',stop:180,label:'Car in the left lane'},{id:'you',kind:'you',path:'M30 330 L30 -20 Q30 -70 -30 -110 L-30 -330',stop:262,indicator:-1},{id:'a2',kind:'car',path:'M-30 400 L-30 -330',stop:190,label:'Second car in the left lane'}],
  order:[['a1'],['you'],['a2']],
  captions:['Your lane ends ahead. The left lane is full.','Zipper: the cars in the continuing lane let one car merge in front of them, alternately. The first left-lane car goes.','You merge — right at the point where the lane ends, not 100 m earlier.','The next left-lane car follows. One from the left, one from the right.'],
  rule:'Where a lane ends, cars in the continuing lane must let the merging cars in alternately: one of theirs, one of yours. Use your lane to the very end — merging early creates the jam. The merging car still has no priority, so signal and wait for the gap.',
  mistake:'Blocking the ending lane out of anger at "queue jumpers". The zipper is the law and using the lane to the end is correct.',
  stvo:'§ 7 Abs. 4 StVO' },
{ id:'j-accel', ch:5, title:'Joining from an acceleration lane', de:'Einfädelungsstreifen: keine Vorfahrt',
  road:{type:'straight',oneway:{S:'in',N:'out'}}, extras:['<path d="M60 330 L60 -140 Q60 -170 30 -180" fill="none" stroke="var(--paint)" stroke-width="3" stroke-dasharray="14 10"/><rect x="60" y="-200" width="40" height="530" fill="var(--asphalt)"/><path d="M100 330 V-200 Q100 -240 60 -260" fill="none" stroke="var(--paint)" stroke-width="4"/>'],
  actors:[{id:'a',kind:'car',path:'M30 330 L30 -330',through:true,label:'Car on the main road'},{id:'you',kind:'you',path:'M80 330 L80 -100 Q80 -160 30 -190 L30 -330',stop:150,indicator:-1,label:'You on the acceleration lane'},{id:'b',kind:'car',path:'M30 420 L30 -330',through:true,delay:.6,label:'Second car on the main road'}],
  order:[['a'],['you'],['b']],
  captions:['You join a main road from a slip lane. Cars are flowing on the main road.','The main road has priority — the acceleration lane gives you none. Match their speed and look for a gap.','You slip into the gap. The car behind you on the main road should keep its distance but does not have to let you in.'],

  actors:[{id:'you',kind:'you',from:'S',turn:'r1',indicator:1,indFrom:.3,stop:290,travel:2.6},{id:'p',kind:'ped',path:'M160 -110 L160 110',stop:20,label:'Pedestrian on the zebra'}],

{ id:'r-mini', ch:6, title:'Mini roundabout', de:'Minikreisel',
